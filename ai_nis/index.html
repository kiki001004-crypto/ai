<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>안전하고 평화로운 대한민국</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 초기화 및 폰트 설정 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Noto Sans KR", sans-serif;
        background-color: #f4f4f4; /* 배경 이미지 로드 전 대체 색상 */
      }

      /* 메인 섹션 (배경 이미지 및 중앙 정렬) */
      .hero-section {
        position: relative;
        width: 100%;
        height: 100vh; /* 화면 전체 높이 사용 */
        min-height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 원본과 유사한 잔디광장 및 건물 배경 이미지 (Unsplash 대체 이미지) */
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)),
          url("./images/bg_about.jpg");
        background-size: cover;
        background-position: center bottom;
        background-repeat: no-repeat;
      }

      /* 1280px 부모 컨테이너 */
      .container {
        width: 100%;
        max-width: 1280px; /* 내부 컨텐츠 너비 1280px 보장 */
        margin: 0 auto;
      }

      /* 타이틀 텍스트 */
      .hero-title {
        color: #ffffff;
        font-size: 42px;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 40px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); /* 가독성을 위한 그림자 */
        letter-spacing: -0.5px;
      }

      /* 3개 박스를 감싸는 Flex 레이아웃 */
      .card-wrapper {
        display: flex;
        justify-content: space-between;
        gap: 24px; /* 박스 사이 간격 */
      }

      /* 개별 카드 디자인 */
      .card {
        flex: 1; /* 3개의 카드가 동일한 비율을 가짐 */
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }

      /* 카드 내 이미지 영역 래퍼 (확대 시 텍스트 영역 침범 방지) */
      .card-image-wrapper {
        width: 100%;
        height: 220px; /* 시안 비율에 맞춘 이미지 높이 */
        overflow: hidden;
      }

      /* 카드 내 이미지 영역 */
      .card-image {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        transition: transform 0.4s ease; /* 부드러운 스케일 효과 추가 */
      }

      /* 마우스 오버 시 이미지 확대 (scale 1.2) */
      .card:hover .card-image {
        transform: scale(1.2);
      }

      /* 카드 하단 텍스트 영역 */
      .card-text {
        padding: 14px 20px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: #222222;
        letter-spacing: -0.3px;
      }

      /* AI 이미지 로딩 인디케이터 */
      #loading-overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* 반응형 처리 (화면이 1320px 이하일 때 여백 추가) */
      @media (max-width: 1320px) {
        .container {
          padding: 0 20px;
        }
      }

      /* 반응형 처리 (태블릿 및 모바일 환경 대비) */
      @media (max-width: 992px) {
        .hero-title {
          font-size: 50px;
        }
        .card-image-wrapper {
          height: 300px;
        }
      }

      @media (max-width: 768px) {
        .card-wrapper {
          flex-direction: column;
        }
        .card-image-wrapper {
          height: 200px;
        }
        .hero-title {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero-section" id="hero-section">
      <!-- AI 배경 이미지 생성 로딩 표시 -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        AI 배경 이미지 생성 중...
      </div>

      <div class="container">
        <!-- 텍스트 영역 -->
        <h1 class="hero-title">
          안전하고 평화로운 대한민국을 위해<br />
          국가정보원이 함께합니다.
        </h1>

        <!-- 1280px 내에 배치되는 3개의 카드 영역 -->
        <div class="card-wrapper">
          <!-- 카드 1: 직무 -->
          <div class="card">
            <!-- 회의하는 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_1.jpg&quot;);
                "
              ></div>
            </div>
            <div class="card-text">직무</div>
          </div>

          <!-- 카드 2: 국정원 역사 -->
          <div class="card">
            <!-- 도서관/기록보관소 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_2.png&quot;);
                "
              ></div>
            </div>
            <div class="card-text">국정원 역사</div>
          </div>

          <!-- 카드 3: 관련 법령 -->
          <div class="card">
            <!-- 문서 작성/서명 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_3.jpg&quot;);
                "
              ></div>
            </div>
            <div class="card-text">관련 법령</div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const apiKey = "";
      const heroSection = document.getElementById("hero-section");
      const loadingOverlay = document.getElementById("loading-overlay");

      // 시안 배경과 유사한 형태를 지시하는 프롬프트
      const promptText =
        "A large modern government building with a wide circular plaza in front, surrounded by a vast, bright green grassy lawn in the foreground. Sunny day, realistic, architectural photography.";

      // API 호출 지수 백오프 함수
      async function fetchWithRetry(url, options, maxRetries = 5) {
        let retries = 0;
        let delay = 1000;
        while (retries < maxRetries) {
          try {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
            return await response.json();
          } catch (error) {
            retries++;
            if (retries >= maxRetries) throw error;
            await new Promise((resolve) => setTimeout(resolve, delay));
            delay *= 2;
          }
        }
      }

      // 백그라운드 이미지 생성 및 적용
      async function generateBackgroundImage() {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
        const payload = {
          instances: { prompt: promptText },
          parameters: { sampleCount: 1 },
        };

        try {
          const result = await fetchWithRetry(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (result.predictions && result.predictions.length > 0) {
            const imageUrl = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
            // API 결과 이미지를 영문/그라데이션과 함께 배경으로 대체 적용
            heroSection.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), url('${imageUrl}')`;
          }
        } catch (error) {
          console.error("이미지 생성 실패:", error);
          if (loadingOverlay) {
            loadingOverlay.innerHTML = "이미지 생성 실패 (기존 임시 배경 유지)";
            setTimeout(() => {
              loadingOverlay.style.display = "none";
            }, 3000);
          }
          return;
        }

        if (loadingOverlay) loadingOverlay.style.display = "none";
      }

      // DOM 로드 후 이미지 생성 실행
      window.addEventListener("DOMContentLoaded", generateBackgroundImage);
    </script>
  </body>
</html>
