<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>안전하고 평화로운 대한민국</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <section class="hero-section" id="hero-section">
      <!-- AI 배경 이미지 생성 로딩 표시 -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        AI 배경 이미지 생성 중...
      </div>

      <div class="container">
        <!-- 텍스트 영역 -->
        <h1 class="hero-title">
          안전하고 평화로운 대한민국을 위해<br />
          국가정보원이 함께합니다.
        </h1>

        <!-- 1280px 내에 배치되는 3개의 카드 영역 -->
        <div class="card-wrapper">
          <!-- 카드 1: 직무 -->
          <div class="card">
            <!-- 회의하는 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_1.jpg&quot;);
                "
              ></div>
            </div>
            <div class="card-text">직무</div>
          </div>

          <!-- 카드 2: 국정원 역사 -->
          <div class="card">
            <!-- 도서관/기록보관소 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_2.png&quot;);
                "
              ></div>
            </div>
            <div class="card-text">국정원 역사</div>
          </div>

          <!-- 카드 3: 관련 법령 -->
          <div class="card">
            <!-- 문서 작성/서명 모습 (임시 이미지) -->
            <div class="card-image-wrapper">
              <div
                class="card-image"
                style="
                  background-image: url(&quot;./images/img_about_3.jpg&quot;);
                "
              ></div>
            </div>
            <div class="card-text">관련 법령</div>
          </div>
        </div>
      </div>
    </section>

    <script src="./script/ai_nis.js"></script>
  </body>
</html>
