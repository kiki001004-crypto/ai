<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        background: #efefef;
        color: #222;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        padding: 110px 0 84px;
      }

      .wrap {
        width: 920px;
        margin: 0 auto;
      }

      .hero {
        text-align: center;
        margin-bottom: 42px;
      }

      .hero-title {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 18px;
      }

      .hero-text {
        font-size: 17px;
        line-height: 1.55;
        color: #333;
      }

      .social-list {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-bottom: 42px;
      }

      .social-item {
        width: 48px;
        height: 48px;
        display: block;
        text-decoration: none;
      }

      .social-item img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .grid {
        display: grid;
        grid-template-columns: 254px 382px 252px;
        grid-template-rows: 348px 166px;
        gap: 16px;
      }

      .card {
        background: transparent;
        border: 1px solid #8f8f8f;
        padding: 20px 24px;
        position: relative;
      }

      .card-title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }

      .card-text {
        font-size: 15px;
        line-height: 1.5;
        color: #222;
        word-break: keep-all;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }

      .blank {
        grid-row: 1 / 3;
        padding: 0;
        transition: background-color 0.25s ease;
      }

      .blank:hover {
        background: #ff6a00;
      }

      .promo {
        grid-column: 2;
        grid-row: 1;
        transition: background-color 0.25s ease;
      }

      .promo:hover {
        background: pink;
      }
      .inquiry {
        grid-column: 2;
        grid-row: 2;
        transition: background-color 0.25s ease;
      }

      .inquiry:hover {
        background: yellowgreen;
      }

      .share {
        transition: background-color 0.25s ease;
      }

      .share:hover {
        background: skyblue;
      }

      .notice {
        transition: background-color 0.25s ease;
      }

      .notice:hover {
        background: purple;
      }

      .product {
        transition: background-color 0.25s ease;
      }

      .product:hover {
        background: gold;
      }

      .right-stack {
        display: grid;
        grid-column: 3;
        grid-row: 1 / 3;
        grid-template-rows: 166px 166px 166px;
        gap: 16px;
      }

      .promo:hover .card-title,
      .promo:hover .card-text {
        color: #fff;
      }

      .promo:hover .button {
        background: #fff;
        color: #ff6a00;
      }

      .inquiry:hover .card-title,
      .inquiry:hover .card-text {
        color: #fff;
      }

      .inquiry:hover .button {
        background: #fff;
        color: yellowgreen;
      }

      .share:hover .card-title,
      .share:hover .card-text {
        color: #fff;
      }

      .share:hover .button {
        background: #fff;
        color: skyblue;
      }

      .notice:hover .card-title,
      .notice:hover .card-text {
        color: #fff;
      }

      .notice:hover .button {
        background: #fff;
        color: purple;
      }

      .product:hover .card-title,
      .product:hover .card-text {
        color: #fff;
      }

      .product:hover .button {
        background: #fff;
        color: gold;
      }

      .button {
        display: inline-block;
        margin-top: 24px;
        min-width: 72px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #ff6a00;
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      @media (max-width: 980px) {
        .wrap {
          width: calc(100% - 48px);
        }

        .grid {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
        }

        .blank,
        .promo,
        .inquiry,
        .right-stack {
          grid-column: auto;
          grid-row: auto;
        }

        .blank {
          min-height: 260px;
        }

        .right-stack {
          grid-template-rows: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="wrap">
        <div class="hero">
          <div class="hero-title">COMMUNITY</div>
          <div class="hero-text">
            삼양식품은 혁신적인 기술과 포용적인 사고로 여러분과 함께<br />새로운
            식문화를 만들어갑니다.
          </div>
        </div>

        <div class="social-list">
          <a href="#" class="social-item facebook">
            <img src="./images/ico_facebook.png" alt="페이스북" />
          </a>
          <a href="#" class="social-item instagram">
            <img src="./images/ico_insta.png" alt="인스타그램" />
          </a>
          <a href="#" class="social-item blog">
            <img src="./images/ico_blog.png" alt="블로그" />
          </a>
          <a href="#" class="social-item twitter">
            <img src="./images/ico_twitter.png" alt="트위터" />
          </a>
        </div>

        <div class="grid">
          <div class="card blank"></div>

          <div class="card promo">
            <div class="card-title">홍보영상</div>
            <div class="card-text">
              삼양식품의 다채로운 스토리를<br />영상으로 보여드립니다.
            </div>
            <a href="#" class="button">자세히보기</a>
          </div>

          <div class="card inquiry">
            <div class="card-title">고객 문의</div>
            <div class="card-text">
              삼양식품에게<br />여러분의 다양한 의견을 남겨주세요.
            </div>
            <a href="#" class="button">자세히보기</a>
          </div>

          <div class="right-stack">
            <div class="card share">
              <div class="card-title">맛있는 나눔</div>
              <div class="card-text">모두가 행복한 맛있는 세상</div>
              <a href="#" class="button">자세히보기</a>
            </div>

            <div class="card notice">
              <div class="card-title">공지사항</div>
              <div class="card-text">삼양식품 개인정보처리방침 개정 안내</div>
              <a href="#" class="button">자세히보기</a>
            </div>

            <div class="card product">
              <div class="card-title">삼양식품 공식몰</div>
              <div class="card-text">
                삼양식품의<br />다양한 제품을 만나보세요.
              </div>
              <a href="#" class="button">자세히보기</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
