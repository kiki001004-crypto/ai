<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="wrap">
        <div class="hero">
          <div class="hero-title">COMMUNITY</div>
          <div class="hero-text">
            삼양식품은 혁신적인 기술과 포용적인 사고로 여러분과 함께<br />새로운
            식문화를 만들어갑니다.
          </div>
        </div>

        <div class="social-list">
          <a href="#" class="social-item facebook">
            <img src="./images/ico_facebook.png" alt="페이스북" />
          </a>
          <a href="#" class="social-item instagram">
            <img src="./images/ico_insta.png" alt="인스타그램" />
          </a>
          <a href="#" class="social-item blog">
            <img src="./images/ico_blog.png" alt="블로그" />
          </a>
          <a href="#" class="social-item twitter">
            <img src="./images/ico_twitter.png" alt="트위터" />
          </a>
        </div>

        <div class="grid">
          <div class="card blank"></div>

          <div class="card promo">
            <div class="card-title">홍보영상</div>
            <div class="card-text">
              삼양식품의 다채로운 스토리를<br />영상으로 보여드립니다.
            </div>
            <a href="#" class="button">자세히보기</a>
          </div>

          <div class="card inquiry">
            <div class="card-title">고객 문의</div>
            <div class="card-text">
              삼양식품에게<br />여러분의 다양한 의견을 남겨주세요.
            </div>
            <a href="#" class="button">자세히보기</a>
          </div>

          <div class="right-stack">
            <div class="card share">
              <div class="card-title">맛있는 나눔</div>
              <div class="card-text">모두가 행복한 맛있는 세상</div>
              <a href="#" class="button">자세히보기</a>
            </div>

            <div class="card notice">
              <div class="card-title">공지사항</div>
              <div class="card-text">삼양식품 개인정보처리방침 개정 안내</div>
              <a href="#" class="button">자세히보기</a>
            </div>

            <div class="card product">
              <div class="card-title">삼양식품 공식몰</div>
              <div class="card-text">
                삼양식품의<br />다양한 제품을 만나보세요.
              </div>
              <a href="#" class="button">자세히보기</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
