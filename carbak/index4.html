<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CARBAK 모바일 온보딩</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <style>
      :root {
        --bg: #fff;
        --primary: #5a73bd;
        --text-main: #334b87;
        --text-sub: #8fa0d1;
        --white: #ffffff;
        --shape: #eef2fb;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text-main);
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        position: relative;
        width: 100%;
        max-width: 430px;
        height: 100dvh;
        background: var(--bg);
        overflow: hidden;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        opacity: 1;
        transform: translate3d(0, 0, 0);
        will-change: transform, opacity;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .screen.hidden,
      .screen.hidden-right {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate3d(0, 0, 0);
      }

      .screen.is-preparing-right,
      .screen.is-preparing-left {
        opacity: 0;
        visibility: visible;
        pointer-events: none;
        transform: translate3d(0, 12px, 0);
      }

      .screen.is-entering {
        animation: screenFadeIn 320ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      .screen.is-leaving-left,
      .screen.is-leaving-right {
        opacity: 1;
        visibility: visible;
        pointer-events: none;
        transform: translate3d(0, 0, 0);
        animation: screenFadeOut 280ms ease both;
      }

      @keyframes screenFadeIn {
        from {
          opacity: 0;
          transform: translate3d(0, 12px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes screenFadeOut {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
        to {
          opacity: 0;
          transform: translate3d(0, -6px, 0);
        }
      }

      .onboarding-screen {
        overflow: hidden;
      }

      .swiper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .bg-ribbon-wrap {
        position: absolute;
        left: -6%;
        top: 250px;
        width: 112%;
        height: 430px;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .bg-ribbon-track {
        width: 300%;
        height: 100%;
        transform: translate3d(0, 0, 0);
        transition: transform 700ms ease;
      }

      .bg-ribbon-track svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .bg-ribbon-track path {
        fill: var(--shape);
      }

      .swiper-wrapper {
        position: relative;
        z-index: 2;
      }

      .swiper-slide {
        position: relative;
        padding: 72px 0 170px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        width: 100%;
        min-height: 100%;
      }

      .copy {
        position: relative;
        z-index: 5;
        margin-top: 8px;
        padding: 0 24px;
      }

      .eyebrow {
        font-size: 24px;
        line-height: 1.35;
        font-weight: 700;
        color: #6b83bf;
        letter-spacing: -0.03em;
      }

      .headline {
        margin-top: 2px;
        font-size: 28px;
        line-height: 1.28;
        font-weight: 800;
        letter-spacing: -0.045em;
        color: var(--text-main);
        word-break: keep-all;
      }

      .headline .light {
        color: #6b83bf;
        font-weight: 700;
      }

      .desc {
        margin-top: 14px;
        font-size: 16px;
        line-height: 1.55;
        letter-spacing: -0.03em;
        color: var(--text-sub);
        word-break: keep-all;
      }

      .visual-wrap {
        position: relative;
        z-index: 6;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0;
        min-height: 340px;
        margin-top: -16px;
      }

      .visual-wrap img {
        position: relative;
        z-index: 7;
        display: block;
        width: min(100%, 318px);
        height: auto;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      .bottom-ui {
        display: none;
      }

      .onboarding-footer {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 34px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
        pointer-events: none;
      }

      .onboarding-footer .swiper-pagination,
      .onboarding-footer .cta {
        pointer-events: auto;
      }

      .swiper-pagination {
        position: static;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .swiper-pagination-bullet {
        width: 10px;
        height: 10px;
        margin: 0 !important;
        background: #d8dceb;
        opacity: 1;
        transition:
          transform 0.3s ease,
          background 0.3s ease,
          opacity 0.3s ease;
      }

      .swiper-pagination-bullet-active {
        background: var(--primary);
        transform: scale(1.12);
      }

      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        height: 56px;
        line-height: 1;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--white);
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        box-shadow: 0 8px 20px rgba(90, 115, 189, 0.18);
        transition:
          transform 0.18s ease,
          background 0.18s ease;
        flex-shrink: 0;
      }

      .cta:active {
        transform: scale(0.985);
        background: #4e67af;
      }

      .login-screen {
        padding: 42px 24px calc(24px + env(safe-area-inset-bottom));

        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: 100%;
        background: #fff;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .brand {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 18px;
        margin-bottom: 52px;
        height: auto;
        overflow: visible;
      }

      .brand img {
        width: 178px;
        max-width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        transform: none;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }

      .field-label {
        font-size: 16px;
        line-height: 1.2;
        color: var(--primary);
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .field {
        width: 100%;
        height: 48px;
        border: 0;
        border-bottom: 1px solid #cfd5e4;
        background: transparent;
        outline: none;
        font-size: 16px;
        color: var(--text-main);
        padding: 0 0 6px;
      }

      .field::placeholder {
        color: #b0bad8;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 48px;
        min-height: 48px;
        padding: 0 16px;
        line-height: 1;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.03em;
        cursor: pointer;
        flex-shrink: 0;
      }

      .btn-primary {
        margin-top: 22px;
        border: none;
        background: var(--primary);
        color: var(--white);
      }

      .btn-outline {
        margin-top: 18px;
        border: 1.5px solid var(--primary);
        background: transparent;
        color: var(--primary);
      }

      .links {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        color: #6174a8;
        font-size: 14px;
        letter-spacing: -0.03em;
      }

      .links a {
        color: inherit;
        text-decoration: none;
      }

      .simple-login {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        color: var(--primary);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .simple-login::before,
      .simple-login::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #9fb0dd;
      }

      .socials {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
      }

      .social-btn {
        width: 38px;
        height: 38px;
        border: 0;
        background: transparent;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .social-btn img,
      .social-btn svg {
        width: 28px;
        height: 28px;
        object-fit: contain;
        display: block;
      }

      .main-screen {
        display: flex;
        flex-direction: column;
        background: #fff;
        overflow: hidden;
      }

      .main-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 98px;
      }

      .main-banner-swiper {
        position: relative;
        width: 100%;
        height: 322px;
        overflow: hidden;
      }

      .main-banner-swiper .swiper-slide {
        padding: 0;
        min-height: 0;
        height: 322px;
      }

      .hero-image {
        display: block;
        width: 100%;
        height: 322px;
        object-fit: cover;
      }

      .main-banner-pagination {
        position: absolute;
        left: 0 !important;
        right: 0;
        bottom: 14px !important;
        z-index: 5;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .main-banner-pagination .swiper-pagination-bullet {
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.55);
        opacity: 1;
        margin: 0 !important;
      }

      .main-banner-pagination .swiper-pagination-bullet-active {
        background: #fff;
        transform: scale(1.08);
      }

      .hero-image {
        display: block;
        width: 100%;
        height: 322px;
        object-fit: cover;
      }

      .main-content {
        padding: 18px 24px 0;
      }

      .section-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
        margin: 0 0 22px;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        row-gap: 18px;
        column-gap: 10px;
        margin-bottom: 22px;
      }

      .category-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        padding: 0;
        color: #2b2b2b;
        font-size: 12px;
        cursor: pointer;
      }

      .category-emoji {
        font-size: 24px;
        line-height: 1;
      }

      .promo-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }

      .promo-btn {
        height: 44px;
        border: 0;
        border-radius: 9px;
        background: #b7c2e0;
        color: var(--primary);
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      .promo-icon {
        font-size: 18px;
        line-height: 1;
      }

      .ranking-header {
        margin: 14px 0 14px;
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
      }

      .ranking-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px 14px;
        margin-bottom: 14px;
      }

      .place-card {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }

      .place-card img {
        width: 100%;
        height: 118px;
        border-radius: 0;
        object-fit: cover;
        display: block;
      }

      .place-card.large {
        grid-column: 1 / -1;
      }

      .place-card.large img {
        height: 190px;
      }

      .main-tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(74px + env(safe-area-inset-bottom));
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid #e6e6e6;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        z-index: 20;
      }

      .tab-item {
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #c7c7c7;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
      }

      .tab-item svg {
        width: 22px;
        height: 22px;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tab-item.active {
        color: var(--primary);
      }

      .tab-item,
      .cta,
      .btn,
      .social-btn {
        transition:
          color 0.18s ease,
          background 0.18s ease,
          transform 0.18s ease,
          opacity 0.18s ease;
      }

      .tab-item:hover {
        color: #4e67af;
      }

      .tab-item.active:hover {
        color: #3f57a0;
      }

      .cta:hover,
      .btn-primary:hover {
        background: #4e67af;
      }

      .btn-outline:hover {
        background: rgba(90, 115, 189, 0.08);
        border-color: #4e67af;
        color: #4e67af;
      }

      .social-btn:hover {
        transform: translateY(-1px);
        opacity: 0.88;
      }



      /* Added hover states for submission/demo on desktop preview */
      .category-item,
      .promo-btn,
      .place-card,
      .main-tabbar .tab-item,
      .links a,
      .start-link,
      .main-banner-swiper,
      .field,
      .btn-outline,
      .btn-primary {
        transition:
          color 0.18s ease,
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.18s ease,
          opacity 0.18s ease,
          filter 0.18s ease;
      }

      .category-item:hover {
        color: #4e67af;
        transform: translateY(-1px);
      }

      .category-item:hover .category-emoji {
        filter: brightness(0.9);
      }

      .promo-btn:hover {
        background: #a7b5da;
        color: #425b9f;
        transform: translateY(-1px);
      }

      .place-card:hover {
        opacity: 0.94;
        transform: translateY(-2px);
      }

      .place-card:hover img {
        filter: brightness(0.96);
      }

      .links a:hover {
        color: #4e67af;
      }

      .field:hover,
      .field:focus {
        border-bottom-color: #4e67af;
      }

      .main-banner-swiper:hover .hero-image {
        filter: brightness(0.97);
      }

      @media (min-width: 431px) {
        body {
          background: #efefef;
        }

        .app {
          border-radius: 26px;
          box-shadow: 0 22px 60px rgba(35, 49, 86, 0.18);
          height: min(100dvh, 900px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section id="onboarding" class="screen onboarding-screen">
        <div class="swiper onboardingSwiper">
          <div class="bg-ribbon-wrap" aria-hidden="true">
            <div class="bg-ribbon-track" id="bgRibbonTrack">
              <svg
                viewBox="0 0 1260 420"
                preserveAspectRatio="none"
                class="bg-ribbon"
              >
                <path
                  d="M-36 150
                       C10 132 56 128 106 138
                       C154 148 200 182 248 192
                       C296 202 338 188 378 170
                       C420 150 462 142 510 150
                       C556 158 600 188 646 198
                       C694 208 738 194 780 176
                       C824 158 868 150 916 158
                       C962 166 1004 190 1048 202
                       C1092 214 1138 206 1184 186
                       C1210 174 1236 164 1272 160
                       C1278 214 1270 262 1250 312
                       C1200 332 1148 338 1092 332
                       C1038 326 988 306 938 294
                       C890 282 842 282 792 292
                       C740 302 692 318 642 324
                       C592 330 544 322 498 308
                       C452 294 408 278 362 274
                       C314 270 268 278 220 288
                       C172 298 122 304 70 298
                       C26 292 -12 276 -36 262
                       C-44 226 -44 186 -36 150 Z"
                ></path>
              </svg>
            </div>
          </div>

          <div class="swiper-wrapper">
            <div class="swiper-slide slide-work1">
              <div class="copy">
                <div class="eyebrow">차박</div>
                <div class="headline">
                  어디로 <span class="light">떠나야할지 모르겠나요</span>
                </div>
                <div class="desc">
                  지도기반 위치 앱 및 키워드 검색으로 내가 원하는 장소를 한번에
                </div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work1-1.png" alt="차박 장소 추천 일러스트" />
              </div>
            </div>

            <div class="swiper-slide slide-work2">
              <div class="copy">
                <div class="eyebrow">차만 있다면</div>
                <div class="headline">
                  장비는 <span class="light">부담적은</span> 렌탈로
                </div>
                <div class="desc">차박에 필요한 용품들을 용도별로 둘러봐요</div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work2-1.png" alt="차박 장비 렌탈 일러스트" />
              </div>
            </div>

            <div class="swiper-slide slide-work3">
              <div class="copy">
                <div class="eyebrow">일상이 바쁠 땐 실시간</div>
                <div class="headline">라이브로 대리만족하세요</div>
                <div class="desc">
                  라이브로 나를 뽐내고 시청자들과 소통하는 즐거움!
                </div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work3-1.png" alt="차박 라이브 일러스트" />
              </div>
            </div>
          </div>

          <div class="onboarding-footer">
            <div class="swiper-pagination"></div>
            <a href="#login" class="cta start-link">시작하기</a>
          </div>
        </div>
      </section>

      <section id="login" class="screen login-screen hidden" aria-hidden="true">
        <div class="brand">
          <img src="./images/splash.png" alt="CARBAK 로그인" />
        </div>

        <div class="field-group">
          <label class="field-label" for="userId">아이디</label>
          <input
            id="userId"
            class="field"
            type="text"
            autocomplete="username"
          />
        </div>

        <div class="field-group" style="margin-top: 8px">
          <label class="field-label" for="userPw">비밀번호</label>
          <input
            id="userPw"
            class="field"
            type="password"
            autocomplete="current-password"
          />
        </div>

        <button class="btn btn-primary" type="button" id="loginButton">
          로그인
        </button>
        <button class="btn btn-outline" type="button">회원가입</button>

        <div class="links">
          <a href="javascript:void(0)">아이디 찾기</a>
          <span>|</span>
          <a href="javascript:void(0)">비밀번호 찾기</a>
          <span>|</span>
          <a href="javascript:void(0)">둘러보기</a>
        </div>

        <div class="simple-login">간편로그인</div>

        <div class="socials">
          <button class="social-btn" type="button" aria-label="카카오 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#FEE500" />
              <path
                d="M32 14c-10.493 0-19 6.717-19 15 0 5.24 3.402 9.85 8.554 12.529l-2.167 7.927c-.191.698.61 1.256 1.223.85l9.47-6.275c.966.097 1.944.147 2.92.147 10.493 0 19-6.716 19-15S42.493 14 32 14z"
                fill="#1D1A1A"
              />
            </svg>
          </button>
          <button class="social-btn" type="button" aria-label="네이버 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#03C75A" />
              <path d="M23 18h8l10 15V18h8v28h-8L31 31v15h-8z" fill="#fff" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const onboardingScreen = document.getElementById("onboarding");
      const loginScreen = document.getElementById("login");
      const mainScreen = document.getElementById("main");
      const loginButton = document.getElementById("loginButton");
      const bgRibbonTrack = document.getElementById("bgRibbonTrack");

      const swiper = new Swiper(".onboardingSwiper", {
        loop: false,
        effect: "slide",
        speed: 700,
        allowTouchMove: true,
        autoplay: {
          delay: 2200,
          disableOnInteraction: false,
          stopOnLastSlide: true,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        a11y: {
          enabled: true,
        },
        on: {
          init(swiperInstance) {
            bgRibbonTrack.style.transform = `translate3d(-${swiperInstance.activeIndex * (100 / 3)}%, 0, 0)`;
          },
          slideChange(swiperInstance) {
            bgRibbonTrack.style.transform = `translate3d(-${swiperInstance.activeIndex * (100 / 3)}%, 0, 0)`;
          },
        },
      });

      const mainBannerSwiper = new Swiper(".main-banner-swiper", {
        loop: true,
        speed: 500,
        autoplay: {
          delay: 2800,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".main-banner-pagination",
          clickable: true,
        },
      });

      let screenTransitionTimer = null;

      function clearScreenMotionClasses(screen) {
        if (!screen) return;
        screen.classList.remove(
          "hidden",
          "hidden-right",
          "is-preparing-right",
          "is-preparing-left",
          "is-entering",
          "is-leaving-left",
          "is-leaving-right",
        );
        screen.style.animation = "none";
        void screen.offsetWidth;
        screen.style.animation = "";
      }

      function animateScreenTransition(fromScreen, toScreen, direction = "forward") {
        if (!fromScreen || !toScreen || fromScreen === toScreen) return;

        const enteringClass = direction === "back" ? "is-preparing-left" : "is-preparing-right";
        const leavingClass = direction === "back" ? "is-leaving-right" : "is-leaving-left";
        const finalHiddenClass = direction === "back" ? "hidden-right" : "hidden";

        if (screenTransitionTimer) {
          window.clearTimeout(screenTransitionTimer);
          screenTransitionTimer = null;
        }

        clearScreenMotionClasses(fromScreen);
        clearScreenMotionClasses(toScreen);

        toScreen.classList.add(enteringClass);
        toScreen.setAttribute("aria-hidden", "false");
        fromScreen.setAttribute("aria-hidden", "false");

        requestAnimationFrame(() => {
          toScreen.classList.add("is-entering");
          toScreen.classList.remove(enteringClass);
          fromScreen.classList.add(leavingClass);
        });

        screenTransitionTimer = window.setTimeout(() => {
          fromScreen.classList.remove(leavingClass);
          fromScreen.classList.add(finalHiddenClass);
          fromScreen.setAttribute("aria-hidden", "true");
          toScreen.classList.remove(
            "is-preparing-right",
            "is-preparing-left",
            "is-entering",
            "is-leaving-left",
            "is-leaving-right",
          );
          screenTransitionTimer = null;
        }, 340);
      }

      function showLoginScreen() {
        animateScreenTransition(onboardingScreen, loginScreen, "forward");
        mainScreen.classList.add("hidden");
        mainScreen.classList.remove("hidden-right");
        mainScreen.setAttribute("aria-hidden", "true");
        swiper.autoplay.stop();
        history.replaceState(null, "", "#login");
      }

      function showOnboardingScreen() {
        animateScreenTransition(loginScreen, onboardingScreen, "back");
        mainScreen.classList.add("hidden");
        mainScreen.classList.remove("hidden-right");
        mainScreen.setAttribute("aria-hidden", "true");
        swiper.autoplay.start();
        history.replaceState(null, "", "#onboarding");
      }

      function showMainScreen() {
        animateScreenTransition(loginScreen, mainScreen, "forward");
        onboardingScreen.classList.add("hidden");
        onboardingScreen.classList.remove("hidden-right");
        onboardingScreen.setAttribute("aria-hidden", "true");
        swiper.autoplay.stop();
        history.replaceState(null, "", "#main");
      }

      document.querySelectorAll(".start-link").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          showLoginScreen();
        });
      });

      loginButton.addEventListener("click", () => {
        showMainScreen();
      });

      document.querySelectorAll(".tab-item").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-item")
            .forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          if (tab.dataset.tab === "search" && tab.dataset.href) {
            window.location.href = tab.dataset.href;
          }
        });
      });

      window.addEventListener("hashchange", () => {
        if (location.hash === "#login") {
          showLoginScreen();
        } else if (location.hash === "#main") {
          showMainScreen();
        } else {
          showOnboardingScreen();
        }
      });

      if (location.hash === "#login") {
        showLoginScreen();
      } else if (location.hash === "#main") {
        showMainScreen();
      } else {
        history.replaceState(null, "", "#onboarding");
      }
    </script>

        function decodeBase64Utf8(base64) {
          const binary = atob(base64);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          return new TextDecoder("utf-8").decode(bytes);
        }

        function ensureSearchFrameLoaded() {
          if (!searchFrame.srcdoc) {
            searchFrame.srcdoc = decodeBase64Utf8(base64Html);
          }
        }

        function activateOuterTab(tabName) {
          document
            .querySelectorAll(".tab-item")
            .forEach((item) => item.classList.toggle("active", item.dataset.tab === tabName));
        }

        function enhanceSearchFrameNavigation() {
          let frameWindow;
          let frameDocument;

          try {
            frameWindow = searchFrame.contentWindow;
            frameDocument = frameWindow?.document;
          } catch (error) {
            console.warn("검색 프레임 접근 실패", error);
            return;
          }

          if (!frameDocument || frameDocument.body?.dataset.navEnhanced === "true") {
            return;
          }

          frameDocument.body.dataset.navEnhanced = "true";

          const hoverStyle = frameDocument.createElement("style");
          hoverStyle.textContent = `
            .nav-item, .icon-btn, .toolbar-btn, .chip, .bookmark-btn, .ghost-btn, .nav-back, .text-button, .list-card, .action-pill, .line-icon-btn {
              transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            }
            .nav-item:hover, .icon-btn:hover, .ghost-btn:hover, .nav-back:hover, .bookmark-btn:hover, .text-button:hover {
              color: #3f57a0 !important;
            }
            .toolbar-btn:hover, .chip:hover, .line-icon-btn:hover {
              filter: brightness(0.95);
            }
            .list-card:hover {
              transform: translateY(-2px);
              box-shadow: 0 12px 24px rgba(46, 67, 125, 0.12);
            }
            .action-pill:hover {
              background: #f4f7ff;
              border-color: #4e67af;
              color: #4e67af;
            }
            .nav-item.active:hover {
              color: #31488f !important;
            }
          `;
          frameDocument.head.appendChild(hoverStyle);

          const shareIconStyle = frameDocument.createElement("style");
          shareIconStyle.textContent = `
            .share-icon-btn {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              line-height: 0;
            }
            .share-icon-btn svg {
              width: 22px;
              height: 22px;
              display: block;
              stroke: currentColor;
              fill: none;
              stroke-width: 1.9;
              stroke-linecap: round;
              stroke-linejoin: round;
            }
          `;
          frameDocument.head.appendChild(shareIconStyle);

          const shareBtn = frameDocument.getElementById('shareBtn')
            || Array.from(frameDocument.querySelectorAll('.ghost-btn')).find((btn) => {
              const label = `${btn.textContent || ''} ${btn.getAttribute('aria-label') || ''} ${btn.getAttribute('title') || ''}`;
              return /공유|share|⤴|↗|↥/.test(label);
            });

          if (shareBtn) {
            shareBtn.classList.add('share-icon-btn');
            shareBtn.setAttribute('aria-label', '공유');
            shareBtn.setAttribute('title', '공유');
            shareBtn.innerHTML = `
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V5"></path>
                <path d="m7.5 9.5 4.5-4.5 4.5 4.5"></path>
                <path d="M5 13.5V18a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4.5"></path>
              </svg>
            `;
          }

          const homeLink = frameDocument.querySelector('.bottom-nav .nav-link[href="index3.html#main"], .bottom-nav .nav-link');
          if (homeLink) {
            homeLink.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopImmediatePropagation();
              frameWindow.parent.postMessage({ type: 'carbak-open-main' }, '*');
            }, true);
          }

          const bottomNavItems = frameDocument.querySelectorAll('.nav-item[data-nav]');
          bottomNavItems.forEach((btn) => {
            btn.addEventListener('click', (event) => {
              const nav = btn.dataset.nav;
              if (nav === 'home') {
                event.preventDefault();
                event.stopImmediatePropagation();
                frameWindow.parent.postMessage({ type: 'carbak-open-main' }, '*');
                return;
              }
              if (nav === 'group' || nav === 'live') {
                event.preventDefault();
                event.stopImmediatePropagation();
                frameWindow.parent.postMessage({ type: 'carbak-open-main' }, '*');
                return;
              }
              if (nav === 'favorites' || nav === 'my') {
                event.preventDefault();
                event.stopImmediatePropagation();
                if (typeof frameWindow.renderFavoritesPage === 'function') {
                  frameWindow.renderFavoritesPage();
                }
                if (typeof frameWindow.switchScreen === 'function') {
                  frameWindow.switchScreen('favorites');
                }
                if (typeof frameWindow.syncBottomNav === 'function') {
                  frameWindow.syncBottomNav();
                }
              }
            }, true);
          });
        }

        let searchOverlayTimer = null;

        function showSearchOverlayAnimated() {
          if (searchOverlayTimer) {
            window.clearTimeout(searchOverlayTimer);
            searchOverlayTimer = null;
          }
          searchOverlay.style.visibility = "visible";
          searchOverlay.style.pointerEvents = "auto";
          searchOverlay.style.transition = "opacity .24s ease, transform .24s ease, visibility 0s linear 0s";
          requestAnimationFrame(() => {
            searchOverlay.style.opacity = "1";
            searchOverlay.style.transform = "translateY(0) scale(1)";
          });
          searchOverlay.setAttribute("aria-hidden", "false");
        }

        function hideSearchOverlayAnimated() {
          if (searchOverlayTimer) {
            window.clearTimeout(searchOverlayTimer);
            searchOverlayTimer = null;
          }
          searchOverlay.style.pointerEvents = "none";
          searchOverlay.style.transition = "opacity .2s ease, transform .2s ease, visibility 0s linear .2s";
          searchOverlay.style.opacity = "0";
          searchOverlay.style.transform = "translateY(10px) scale(0.995)";
          searchOverlay.setAttribute("aria-hidden", "true");
          searchOverlayTimer = window.setTimeout(() => {
            searchOverlay.style.visibility = "hidden";
            searchOverlayTimer = null;
          }, 200);
        }

        function openSearchOverlay() {
          ensureSearchFrameLoaded();
          showSearchOverlayAnimated();
          activateOuterTab("search");

          try {
            enhanceSearchFrameNavigation();
            searchFrame.contentWindow.postMessage({ type: "carbak-search-opened" }, "*");
          } catch (error) {
            console.warn("검색 프레임 초기화 메시지 전송 실패", error);
          }
        }

        function closeSearchOverlay() {
          hideSearchOverlayAnimated();
          activateOuterTab("home");
          showMainScreen();
        }

        if (searchTab) {
          searchTab.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            openSearchOverlay();
          }, true);
        }

        document.querySelectorAll('.tab-item').forEach((tab) => {
          const tabName = tab.dataset.tab;
          if (!tabName || tabName === 'search') return;

          tab.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            activateOuterTab(tabName);

            if (tabName === 'home') {
              closeSearchOverlay();
              return;
            }

            if (tabName === 'my') {
              openSearchOverlay();
              setTimeout(() => {
                try {
                  enhanceSearchFrameNavigation();
                  const frameWindow = searchFrame.contentWindow;
                  frameWindow.renderFavoritesPage?.();
                  frameWindow.switchScreen?.('favorites');
                  frameWindow.syncBottomNav?.();
                } catch (error) {
                  console.warn('MY 탭 전환 실패', error);
                }
              }, 60);
              return;
            }

            openSearchOverlay();
            setTimeout(() => {
              try {
                enhanceSearchFrameNavigation();
                const frameWindow = searchFrame.contentWindow;
                frameWindow.switchScreen?.('search');
                frameWindow.syncBottomNav?.();
              } catch (error) {
                console.warn('탭 전환 실패', error);
              }
            }, 60);
          }, true);
        });

        searchFrame.addEventListener('load', function () {
          enhanceSearchFrameNavigation();
        });

        window.addEventListener("message", function (event) {
          if (event.data?.type === "carbak-open-main") {
            closeSearchOverlay();
          }
        });

        const originalShowOnboardingScreen = showOnboardingScreen;
        const originalShowLoginScreen = showLoginScreen;
        const originalShowMainScreen = showMainScreen;

        showOnboardingScreen = function () {
          hideSearchOverlayAnimated();
          originalShowOnboardingScreen();
        };

        showLoginScreen = function () {
          hideSearchOverlayAnimated();
          originalShowLoginScreen();
        };

        showMainScreen = function () {
          hideSearchOverlayAnimated();
          activateOuterTab("home");
          originalShowMainScreen();
        };
      })();
    </script>

  </body>
