<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CARBAK 모바일 온보딩</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <style>
      :root {
        --bg: #fff;
        --primary: #5a73bd;
        --text-main: #334b87;
        --text-sub: #8fa0d1;
        --white: #ffffff;
        --shape: #eef2fb;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text-main);
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        position: relative;
        width: 100%;
        max-width: 430px;
        height: 100dvh;
        background: var(--bg);
        overflow: hidden;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        transition:
          transform 0.35s ease,
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(-8%);
      }

      .onboarding-screen {
        overflow: hidden;
      }

      .swiper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .bg-ribbon-wrap {
        position: absolute;
        left: -6%;
        top: 250px;
        width: 112%;
        height: 430px;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .bg-ribbon-track {
        width: 300%;
        height: 100%;
        transform: translate3d(0, 0, 0);
        transition: transform 700ms ease;
      }

      .bg-ribbon-track svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .bg-ribbon-track path {
        fill: var(--shape);
      }

      .swiper-wrapper {
        position: relative;
        z-index: 2;
      }

      .swiper-slide {
        position: relative;
        padding: 72px 0 170px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        width: 100%;
        min-height: 100%;
      }

      .copy {
        position: relative;
        z-index: 5;
        margin-top: 8px;
        padding: 0 24px;
      }

      .eyebrow {
        font-size: 24px;
        line-height: 1.35;
        font-weight: 700;
        color: #6b83bf;
        letter-spacing: -0.03em;
      }

      .headline {
        margin-top: 2px;
        font-size: 28px;
        line-height: 1.28;
        font-weight: 800;
        letter-spacing: -0.045em;
        color: var(--text-main);
        word-break: keep-all;
      }

      .headline .light {
        color: #6b83bf;
        font-weight: 700;
      }

      .desc {
        margin-top: 14px;
        font-size: 16px;
        line-height: 1.55;
        letter-spacing: -0.03em;
        color: var(--text-sub);
        word-break: keep-all;
      }

      .visual-wrap {
        position: relative;
        z-index: 6;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0;
        min-height: 340px;
        margin-top: -16px;
      }

      .visual-wrap img {
        position: relative;
        z-index: 7;
        display: block;
        width: min(100%, 318px);
        height: auto;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      .bottom-ui {
        display: none;
      }

      .onboarding-footer {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 34px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
        pointer-events: none;
      }

      .onboarding-footer .swiper-pagination,
      .onboarding-footer .cta {
        pointer-events: auto;
      }

      .swiper-pagination {
        position: static;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .swiper-pagination-bullet {
        width: 10px;
        height: 10px;
        margin: 0 !important;
        background: #d8dceb;
        opacity: 1;
        transition:
          transform 0.3s ease,
          background 0.3s ease,
          opacity 0.3s ease;
      }

      .swiper-pagination-bullet-active {
        background: var(--primary);
        transform: scale(1.12);
      }

      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        height: 56px;
        line-height: 1;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--white);
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        box-shadow: 0 8px 20px rgba(90, 115, 189, 0.18);
        transition:
          transform 0.18s ease,
          background 0.18s ease;
        flex-shrink: 0;
      }

      .cta:active {
        transform: scale(0.985);
        background: #4e67af;
      }

      .login-screen {
        padding: 8px 24px calc(24px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: 100%;
        background: #fff;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .brand {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        margin-top: 0;
        margin-bottom: 18px;
        height: 118px;
        overflow: hidden;
      }

      .brand img {
        width: 170px;
        max-width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        transform: translateY(-34px);
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }

      .field-label {
        font-size: 16px;
        line-height: 1.2;
        color: var(--primary);
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .field {
        width: 100%;
        height: 48px;
        border: 0;
        border-bottom: 1px solid #cfd5e4;
        background: transparent;
        outline: none;
        font-size: 16px;
        color: var(--text-main);
        padding: 0 0 6px;
      }

      .field::placeholder {
        color: #b0bad8;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 48px;
        min-height: 48px;
        padding: 0 16px;
        line-height: 1;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.03em;
        cursor: pointer;
        flex-shrink: 0;
      }

      .btn-primary {
        margin-top: 22px;
        border: none;
        background: var(--primary);
        color: var(--white);
      }

      .btn-outline {
        margin-top: 18px;
        border: 1.5px solid var(--primary);
        background: transparent;
        color: var(--primary);
      }

      .links {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        color: #6174a8;
        font-size: 14px;
        letter-spacing: -0.03em;
      }

      .links a {
        color: inherit;
        text-decoration: none;
      }

      .simple-login {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        color: var(--primary);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .simple-login::before,
      .simple-login::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #9fb0dd;
      }

      .socials {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
      }

      .social-btn {
        width: 38px;
        height: 38px;
        border: 0;
        background: transparent;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .social-btn img,
      .social-btn svg {
        width: 28px;
        height: 28px;
        object-fit: contain;
        display: block;
      }

      .main-screen {
        display: flex;
        flex-direction: column;
        background: #fff;
        overflow: hidden;
      }

      .main-scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 98px;
      }

      .hero-image {
        display: block;
        width: 100%;
        height: 322px;
        object-fit: cover;
      }

      .main-content {
        padding: 18px 24px 0;
      }

      .section-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
        margin: 0 0 22px;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        row-gap: 18px;
        column-gap: 10px;
        margin-bottom: 22px;
      }

      .category-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        padding: 0;
        color: #2b2b2b;
        font-size: 12px;
        cursor: pointer;
      }

      .category-emoji {
        font-size: 24px;
        line-height: 1;
      }

      .promo-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }

      .promo-btn {
        height: 44px;
        border: 0;
        border-radius: 9px;
        background: #b7c2e0;
        color: var(--primary);
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      .promo-icon {
        font-size: 18px;
        line-height: 1;
      }

      .ranking-header {
        margin: 14px 0 14px;
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
      }

      .ranking-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px 14px;
        margin-bottom: 14px;
      }

      .place-card {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }

      .place-card img {
        width: 100%;
        height: 118px;
        border-radius: 0;
        object-fit: cover;
        display: block;
      }

      .place-card.large {
        grid-column: 1 / -1;
      }

      .place-card.large img {
        height: 190px;
      }

      .main-tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(74px + env(safe-area-inset-bottom));
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid #e6e6e6;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        z-index: 20;
      }

      .tab-item {
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #c7c7c7;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
      }

      .tab-item svg {
        width: 22px;
        height: 22px;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tab-item.active {
        color: var(--primary);
      }

      @media (min-width: 431px) {
        body {
          background: #efefef;
        }

        .app {
          border-radius: 26px;
          box-shadow: 0 22px 60px rgba(35, 49, 86, 0.18);
          height: min(100dvh, 900px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section id="onboarding" class="screen onboarding-screen">
        <div class="swiper onboardingSwiper">
          <div class="bg-ribbon-wrap" aria-hidden="true">
            <div class="bg-ribbon-track" id="bgRibbonTrack">
              <svg
                viewBox="0 0 1260 420"
                preserveAspectRatio="none"
                class="bg-ribbon"
              >
                <path
                  d="M-36 150
                       C10 132 56 128 106 138
                       C154 148 200 182 248 192
                       C296 202 338 188 378 170
                       C420 150 462 142 510 150
                       C556 158 600 188 646 198
                       C694 208 738 194 780 176
                       C824 158 868 150 916 158
                       C962 166 1004 190 1048 202
                       C1092 214 1138 206 1184 186
                       C1210 174 1236 164 1272 160
                       C1278 214 1270 262 1250 312
                       C1200 332 1148 338 1092 332
                       C1038 326 988 306 938 294
                       C890 282 842 282 792 292
                       C740 302 692 318 642 324
                       C592 330 544 322 498 308
                       C452 294 408 278 362 274
                       C314 270 268 278 220 288
                       C172 298 122 304 70 298
                       C26 292 -12 276 -36 262
                       C-44 226 -44 186 -36 150 Z"
                ></path>
              </svg>
            </div>
          </div>

          <div class="swiper-wrapper">
            <div class="swiper-slide slide-work1">
              <div class="copy">
                <div class="eyebrow">차박</div>
                <div class="headline">
                  어디로 <span class="light">떠나야할지 모르겠나요</span>
                </div>
                <div class="desc">
                  지도기반 위치 앱 및 키워드 검색으로 내가 원하는 장소를 한번에
                </div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work1-1.png" alt="차박 장소 추천 일러스트" />
              </div>
            </div>

            <div class="swiper-slide slide-work2">
              <div class="copy">
                <div class="eyebrow">차만 있다면</div>
                <div class="headline">
                  장비는 <span class="light">부담적은</span> 렌탈로
                </div>
                <div class="desc">차박에 필요한 용품들을 용도별로 둘러봐요</div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work2-1.png" alt="차박 장비 렌탈 일러스트" />
              </div>
            </div>

            <div class="swiper-slide slide-work3">
              <div class="copy">
                <div class="eyebrow">일상이 바쁠 땐 실시간</div>
                <div class="headline">라이브로 대리만족하세요</div>
                <div class="desc">
                  라이브로 나를 뽐내고 시청자들과 소통하는 즐거움!
                </div>
              </div>
              <div class="visual-wrap">
                <img src="./images/work3-1.png" alt="차박 라이브 일러스트" />
              </div>
            </div>
          </div>

          <div class="onboarding-footer">
            <div class="swiper-pagination"></div>
            <a href="#login" class="cta start-link">시작하기</a>
          </div>
        </div>
      </section>

      <section id="login" class="screen login-screen hidden" aria-hidden="true">
        <div class="brand">
          <img src="./images/splash-1.png" alt="CARBAK 로그인" />
        </div>

        <div class="field-group">
          <label class="field-label" for="userId">아이디</label>
          <input
            id="userId"
            class="field"
            type="text"
            autocomplete="username"
          />
        </div>

        <div class="field-group" style="margin-top: 8px">
          <label class="field-label" for="userPw">비밀번호</label>
          <input
            id="userPw"
            class="field"
            type="password"
            autocomplete="current-password"
          />
        </div>

        <button class="btn btn-primary" type="button" id="loginButton">
          로그인
        </button>
        <button class="btn btn-outline" type="button">회원가입</button>

        <div class="links">
          <a href="javascript:void(0)">아이디 찾기</a>
          <span>|</span>
          <a href="javascript:void(0)">비밀번호 찾기</a>
          <span>|</span>
          <a href="javascript:void(0)">둘러보기</a>
        </div>

        <div class="simple-login">간편로그인</div>

        <div class="socials">
          <button class="social-btn" type="button" aria-label="카카오 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#FEE500" />
              <path
                d="M32 14c-10.493 0-19 6.717-19 15 0 5.24 3.402 9.85 8.554 12.529l-2.167 7.927c-.191.698.61 1.256 1.223.85l9.47-6.275c.966.097 1.944.147 2.92.147 10.493 0 19-6.716 19-15S42.493 14 32 14z"
                fill="#1D1A1A"
              />
            </svg>
          </button>
          <button class="social-btn" type="button" aria-label="네이버 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#03C75A" />
              <path d="M23 18h8l10 15V18h8v28h-8L31 31v15h-8z" fill="#fff" />
            </svg>
          </button>
          <button class="social-btn" type="button" aria-label="구글 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#fff" />
              <path
                d="M56 32.7c0-1.7-.15-3.33-.43-4.9H32v9.28h13.47c-.58 3-2.28 5.54-4.87 7.24v6.02h7.87C53.08 46.06 56 39.98 56 32.7z"
                fill="#4285F4"
              />
              <path
                d="M32 57c6.75 0 12.42-2.24 16.56-6.08l-7.87-6.02c-2.18 1.46-4.97 2.32-8.69 2.32-6.68 0-12.34-4.51-14.36-10.58H9.5v6.25A24.99 24.99 0 0032 57z"
                fill="#34A853"
              />
              <path
                d="M17.64 36.64A14.99 14.99 0 0116.84 32c0-1.61.28-3.18.8-4.64v-6.25H9.5A24.98 24.98 0 007 32c0 3.99.95 7.77 2.5 10.89l8.14-6.25z"
                fill="#FBBC05"
              />
              <path
                d="M32 16.78c3.67 0 6.96 1.26 9.55 3.74l7.16-7.16C44.41 9.33 38.75 7 32 7A24.99 24.99 0 009.5 21.11l8.14 6.25C19.66 21.29 25.32 16.78 32 16.78z"
                fill="#EA4335"
              />
            </svg>
          </button>
          <button class="social-btn" type="button" aria-label="페이스북 로그인">
            <svg
              viewBox="0 0 64 64"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="64" height="64" rx="6" fill="#1877F2" />
              <path
                d="M37.8 52V35.6h5.5l.8-6.4h-6.3v-4.1c0-1.85.52-3.1 3.17-3.1H44V16.3c-.53-.07-2.35-.23-4.47-.23-4.42 0-7.45 2.7-7.45 7.66v5.47H27v6.4h5.08V52z"
                fill="#fff"
              />
            </svg>
          </button>
        </div>
      </section>

      <section id="main" class="screen main-screen hidden" aria-hidden="true">
        <div class="main-scroll">
          <img class="hero-image" src="./images/main-1.png" alt="메인 배너" />

          <div class="main-content">
            <h2 class="section-title">테마별 카테고리</h2>

            <div class="category-grid">
              <button class="category-item" type="button">
                <span class="category-emoji">🎆</span><span>꽃놀이</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">🔥</span><span>불멍</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">🌆</span><span>도심</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">☄️</span><span>별감상</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">🐕</span><span>반려견</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">🏔️</span><span>오지</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">🎁</span><span>바베큐</span>
              </button>
              <button class="category-item" type="button">
                <span class="category-emoji">⛺</span><span>장비</span>
              </button>
            </div>

            <div class="promo-row">
              <button class="promo-btn" type="button">
                <span class="promo-icon">🎟️</span><span>쿠폰</span>
              </button>
              <button class="promo-btn" type="button">

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const onboardingScreen = document.getElementById("onboarding");
      const loginScreen = document.getElementById("login");
      const mainScreen = document.getElementById("main");
      const loginButton = document.getElementById("loginButton");
      const bgRibbonTrack = document.getElementById("bgRibbonTrack");

      const swiper = new Swiper(".onboardingSwiper", {
        loop: false,
        effect: "slide",
        speed: 700,
        allowTouchMove: true,
        autoplay: {
          delay: 2200,
          disableOnInteraction: false,
          stopOnLastSlide: true,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        a11y: {
          enabled: true,
        },
        on: {
          init(swiperInstance) {
            bgRibbonTrack.style.transform = `translate3d(-${swiperInstance.activeIndex * (100 / 3)}%, 0, 0)`;
          },
          slideChange(swiperInstance) {
            bgRibbonTrack.style.transform = `translate3d(-${swiperInstance.activeIndex * (100 / 3)}%, 0, 0)`;
          },
        },
      });

      function showLoginScreen() {
        onboardingScreen.classList.add("hidden");
        onboardingScreen.setAttribute("aria-hidden", "true");
        mainScreen.classList.add("hidden");
        mainScreen.setAttribute("aria-hidden", "true");
        loginScreen.classList.remove("hidden");
        loginScreen.setAttribute("aria-hidden", "false");
        swiper.autoplay.stop();
        history.replaceState(null, "", "#login");
      }

      function showOnboardingScreen() {
        mainScreen.classList.add("hidden");
        mainScreen.setAttribute("aria-hidden", "true");
        loginScreen.classList.add("hidden");
        loginScreen.setAttribute("aria-hidden", "true");
        onboardingScreen.classList.remove("hidden");
        onboardingScreen.setAttribute("aria-hidden", "false");
        swiper.autoplay.start();
        history.replaceState(null, "", "#onboarding");
      }

      function showMainScreen() {
        onboardingScreen.classList.add("hidden");
        onboardingScreen.setAttribute("aria-hidden", "true");
        loginScreen.classList.add("hidden");
        loginScreen.setAttribute("aria-hidden", "true");
        mainScreen.classList.remove("hidden");
        mainScreen.setAttribute("aria-hidden", "false");
        swiper.autoplay.stop();
        history.replaceState(null, "", "#main");
      }

      document.querySelectorAll(".start-link").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          showLoginScreen();
        });
      });

      loginButton.addEventListener("click", () => {
        showMainScreen();
      });

      document.querySelectorAll(".tab-item").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-item")
            .forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          if (tab.dataset.tab === "search" && tab.dataset.href) {
            window.location.href = tab.dataset.href;
          }
        });
      });

      window.addEventListener("hashchange", () => {
        if (location.hash === "#login") {
          showLoginScreen();
        } else if (location.hash === "#main") {
          showMainScreen();
        } else {
          showOnboardingScreen();
        }
      });

      if (location.hash === "#login") {
        showLoginScreen();
      } else if (location.hash === "#main") {
        showMainScreen();
      } else {
        history.replaceState(null, "", "#onboarding");
      }
    </script>
  </body>
