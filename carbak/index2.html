<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CARBAK Splash</title>
    <style>
      :root {
        --bg: #ffffff;
        --primary: #5a78d6;
        --primary-strong: #6f8ef2;
        --track: rgba(255, 255, 255, 0.14);
        --text: rgba(0, 0, 0, 0.58);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR",
          sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-only {
        width: 100%;
        height: 100%;
        max-width: 480px;
        min-height: 100dvh;
        padding: 28px 24px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        position: relative;
      }

      .logo-wrap {
        width: min(78vw, 290px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 42px;
        animation: floatIn 800ms ease-out both;
      }

      .logo {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 10px 28px rgba(90, 120, 214, 0.22));
      }

      .progress-section {
        width: min(74vw, 240px);
        animation: fadeUp 900ms 180ms ease-out both;
      }

      .progress-track {
        width: 100%;
        height: 7px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
        position: relative;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--primary) 0%,
          var(--primary-strong) 100%
        );
        box-shadow: 0 0 14px rgba(111, 142, 242, 0.65);
        transition: width 90ms linear;
      }

      .loading-text {
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        color: var(--text);
        letter-spacing: 0.08em;
      }

      .hint {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(0, 0, 0, 0.38);
        white-space: nowrap;
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (min-width: 481px) {
        body {
          background: #fff;
        }

        .mobile-only {
          border-radius: 0;
          height: 100dvh;
          box-shadow: none;
        }
      }

      .mobile-only {
        border-radius: 28px;
        height: min(100dvh, 900px);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="mobile-only" aria-label="CARBAK splash screen">
      <div class="logo-wrap">
        <img class="logo" alt="CARBAK 로고" src="./images/splash.png" />
      </div>

      <section class="progress-section" aria-label="로딩 상태">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="loading-text" id="loadingText">Loading... 0%</div>
      </section>
    </main>

    <script>
      const progressBar = document.getElementById("progressBar");
      const loadingText = document.getElementById("loadingText");
      const duration = 3000;
      const redirectUrl = "index3.html";
      const start = performance.now();

      function animateProgress(now) {
        const elapsed = now - start;
        const progress = Math.min((elapsed / duration) * 100, 100);
        const rounded = Math.floor(progress);

        progressBar.style.width = progress + "%";
        loadingText.textContent = `Loading... ${rounded}%`;

        if (elapsed < duration) {
          requestAnimationFrame(animateProgress);
        } else {
          progressBar.style.width = "100%";
          loadingText.textContent = "Loading... 100%";
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 120);
        }
      }

      requestAnimationFrame(animateProgress);
    </script>
  </body>
</html>
