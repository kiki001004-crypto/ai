<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그렇게 사랑합니다 — 한용운</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #7ecf7e;
        font-family: "Nanum Gothic", sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        min-height: 100vh;
        padding: 40px 50px 60px 50px;
      }

      h3.title {
        font-size: 15px;
        font-weight: normal;
        margin-bottom: 0;
        line-height: 1.8;
      }

      .author {
        text-align: right;
        margin-top: 10px;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .poem-container {
        width: 100%;
      }

      .stanza {
        font-size: 14px;
        margin-bottom: 28px;
      }

      .stanza p {
        margin: 0;
        line-height: 2;
      }

      .stanza-1 {
        text-align: left;
      }
      .stanza-2 {
        text-align: center;
      }
      .stanza-3 {
        text-align: right;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h3 class="title"><strong>그렇게 사랑합니다.</strong></h3>
    <p class="author">-한용운-</p>

    <div class="poem-container">
      <div class="stanza stanza-1">
        <p>사랑한다는 사랑앞에서는</p>
        <p>사랑 한다는말을 안합니다.</p>
        <p>안하는것이아니라</p>
        <p>못하는것이 사랑의 진실입니다.</p>
      </div>

      <div class="stanza stanza-2">
        <p>잊어버려야 하겠다는 말은</p>
        <p>잊을수 없다는말입니다.</p>
        <p>정말 잊고싶을 때는 말이 없습니다.</p>
      </div>

      <div class="stanza stanza-3">
        <p>헤어질때 돌아보지 않는것은</p>
        <p>너무 헤어지기 싫기때문입니다.</p>
        <p>그것은 헤어지는것이 아니라</p>
        <p>같이 있다는 말입니다.</p>
      </div>
    </div>
  </body>
</html>
