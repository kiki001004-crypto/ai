<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하이퍼링크 실습</title>
    <style>
      /* 기본 여백 및 글꼴 설정 */
      body {
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px; /* 상단 여백 */
      }

      /* '검색엔진' 제목 스타일 */
      h1 {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #000;
      }

      /* 보라색 구분선 스타일 */
      hr.divider {
        width: 200px; /* 선의 길이 */
        border: 0;
        border-top: 2px solid #8e44ad; /* 보라색 계열 지정 */
        margin-bottom: 20px;
      }

      /* p 태그 스타일 (목록 대체) */
      p {
        margin: 0 0 12px 0;
        padding: 0;
        text-align: center;
      }

      /* 하이퍼링크 스타일 지정 (밑줄 제거 및 색상 변경) */
      a {
        text-decoration: none;
        color: #333; /* 짙은 회색으로 텍스트 색상 통일 */
        font-size: 15px;
      }

      /* 마우스 오버 시 밑줄 표시 (사용성 향상 목적) */
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>검색엔진</h1>
    <hr class="divider" />

    <!-- p 태그를 사용한 링크 연결 -->
    <p><a href="https://www.naver.com" target="_blank">네이버</a></p>
    <p><a href="https://www.daum.net" target="_blank">다음</a></p>
    <p><a href="https://www.google.com" target="_blank">구글</a></p>
    <p><a href="https://www.nate.com" target="_blank">네이트</a></p>
    <!-- 임시 링크 지정 및 우체국 연결 -->
    <p><a href="https://www.epost.go.kr/" target="_blank">배송조회</a></p>
    <p><a href="./imgsearch.html">쇼핑몰 사이트로 가기</a></p>
  </body>
</html>
