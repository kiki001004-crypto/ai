<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style2.css" />
  </head>

  <body>
    <table class="table-1">
      <thead>
        <tr>
          <!-- 3개의 칸을 하나로 병합 -->
          <th colspan="3">먹는것</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>사과</td>
          <td>딸기</td>
          <td>바나나</td>
        </tr>
      </tbody>
    </table>

    <table class="table-2">
      <tbody>
        <tr>
          <!-- 3개의 행을 하나로 세로 병합 -->
          <th rowspan="3">타는것</th>
          <td>
            <a
              href="https://www.naver.com"
              target="_blank"
              style="text-decoration: none"
              >비행기</a
            >
          </td>
        </tr>
        <tr>
          <td>자동차</td>
        </tr>
        <tr>
          <td>기차</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
