<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440" />
    <title>Claude Header Desktop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #222;
        min-width: 1440px;
      }

      .header {
        width: 100%;
        min-width: 1440px;
        height: 80px;
        background: #f3f3f3;
        border-bottom: 1px solid #e6e6e6;
      }

      .header-inner {
        width: 1440px;
        height: 80px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
      }

      .left-group {
        display: flex;
        align-items: center;
        gap: 42px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .logo-mark {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }

      .logo-mark::before,
      .logo-mark::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 2px;
        background: #e07d57;
        transform: translate(-50%, -50%);
        border-radius: 2px;
      }

      .logo-mark::after {
        transform: translate(-50%, -50%) rotate(90deg);
      }

      .logo-mark span,
      .logo-mark i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 2px;
        background: #e07d57;
        border-radius: 2px;
      }

      .logo-mark span {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .logo-mark i {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .logo-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 27px;
        line-height: 1;
        font-weight: 700;
        color: #111;
        letter-spacing: -0.4px;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 56px;
        height: 80px;
      }

      .nav a {
        position: relative;
        display: inline-flex;
        align-items: center;
        height: 80px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        color: #222;
        text-transform: uppercase;
        transition: color 0.2s ease;
      }

      /* 기본 active 상태: 밑줄 없음 */
      .nav a.active {
        color: #222;
      }

      /* hover 시 색상 + 밑줄 */
      .nav a:hover {
        color: #e07d57;
      }

      .nav a:hover::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 4px;
        background: #e07d57;
        border-radius: 999px;
      }

      .right-group {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .btn {
        height: 38px;
        padding: 0 22px;
        border: none;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-dark {
        background: #3a3a3a;
        color: #fff;
      }

      .btn-accent {
        background: #e07d57;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="left-group">
          <div class="logo">
            <div class="logo-mark">
              <span></span>
              <i></i>
            </div>
            <div class="logo-text">Claude</div>
          </div>

          <nav class="nav">
            <a href="#" class="active">ABOUT</a>
            <a href="#">PRODUCTS</a>
            <a href="#">PARTERSHIP</a>
            <a href="#">EDUCATION</a>
            <a href="#">WHAT’S NEW</a>
            <a href="#">SUPPORT</a>
          </nav>
        </div>

        <div class="right-group">
          <button class="btn btn-dark">매장찾기</button>
          <button class="btn btn-accent">클로드마켓</button>
        </div>
      </div>
    </header>
  </body>
</html>
