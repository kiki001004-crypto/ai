<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이름이 없는 함수 선언</title>
  </head>
  <body>
    <script>
      // 이름 없는 함수를 변수에 담아서 쓴다
      let hi = function () {
        // 실행할 함수 기능 코딩
        alert("안녕하세요?");
      };
      hi();
    </script>
  </body>
</html>
