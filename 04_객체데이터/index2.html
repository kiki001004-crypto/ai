<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응용</title>
  </head>
  <body>
    <script>
      let score = {
        book: "소년이 온다",
        name: "한강",
        price: "13,500원",
        date: "2014년 5월 19일",
        jumsu: "9.9",
      };
      console.log(score);
      document.write(`<br>1.책제목= ${score.book}`);
      document.write(`<br>2.저자이름=${score.name}`);
      document.write(`<br>3.가격=${score.price}`);
      document.write(`<br>4.출간일=${score.date}`);
      document.write(`<br>5.평점=${score.jumsu}`);
    </script>
  </body>
</html>
