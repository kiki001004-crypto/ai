<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응용1</title>
    <link rel="stylesheet" href="./css/style1.css" />
  </head>
  <body>
    <form action="login" method="post">
      <fieldset>
        <legend>개인 정보</legend>
        <ol>
          <li>
            <label for="name" class="namebox">이름</label>
            <input type="text" class="namebox2" name="name" id="name" />
          </li>
          <li>
            <label for="mail">메일주소</label>
            <input type="text" name="mail" id="mail" />
          </li>
        </ol>
      </fieldset>
      <fieldset>
        <legend>로그인 정보</legend>
        <ol>
          <li>
            <label for="id" class="idbox">아이디</label>
            <input type="text" class="idbox2" name="id" id="id" />
          </li>
          <li>
            <label for="pw">비밀번호</label>
            <input type="password" name="pw" id="pw" />
          </li>
        </ol>
      </fieldset>
    </form>
  </body>
</html>
