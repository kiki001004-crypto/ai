<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응용3</title>
    <link rel="stylesheet" href="./css/style3.css" />
  </head>
  <body>
    <form action="" name="Subjec" method="post">
      <fieldset>
        <legend>신청과목</legend>

        <ol>
          <li>이 달에 신청할 과목을 선택하세요 (1과목만 가능)</li>
          <li>
            <input type="radio" name="eng" checked id="speak" />
            <label for="speak">회화</label>
            <input type="radio" name="eng" id="Gramma" />
            <label for="Gramma">문법</label>
            <input type="radio" name="eng" id="Writing" />
            <label for="Writing">작문</label>
          </li>
        </ol>
      </fieldset>
      <fieldset>
        <legend>메일링</legend>
        <ol>
          <li>메일로 받고 싶은 뉴스 주제를 선택해 주세요(복수선택가능)</li>

          <li>
            <input type="checkbox" name="mail" checked id="Short" />
            <label for="Short">해외단신</label>
            <input type="checkbox" name="mail" id="five" />
            <label for="five">5분 회화</label>
            <input type="checkbox" name="mail" id="pops" />
            <label for="pops">모닝팝스</label>
          </li>
        </ol>
      </fieldset>
    </form>
  </body>
</html>
