<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>절대반지는?</title>
    <style>
      body {
        background-color: #ffffff;
        font-family:
          "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
        margin: 0;
        padding: 40px 20px;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: bold;
        color: #ff0000;
        margin-bottom: 20px;
      }

      p {
        margin: 4px 0;
        font-size: 1rem;
        line-height: 1.9;
      }

      hr {
        border: none;
        border-top: 1px solid #c2c2c2;
        margin: 2px auto;
      }

      /* line1~5 각 텍스트 픽셀 너비 기반 */
      hr.hr1 {
        width: 309px;
      } /* line1: 반지 세 개는... */
      hr.hr2 {
        width: 376px;
      } /* line2: 일곱 개는... */
      hr.hr3 {
        width: 272px;
      } /* line3: 아홉 개는... */
      hr.hr4 {
        width: 340px;
      } /* line4: 하나는... */
      hr.hr5 {
        width: 292px;
      } /* line5: 그곳은... */

      hr.hr8 {
        width: 100%;
      }
      hr.hr6 {
        width: 499px;
      } /* line6: 그 모든 반지를 다스릴... */
      hr.hr7 {
        width: 408px;
      } /* line7: 그 모든 반지를 암흑... */

      .line1 {
        color: #cc0000;
      }
      .line2 {
        color: #cc6600;
      }
      .line3 {
        color: #ccaa00;
      }
      .line4 {
        color: #336600;
      }
      .line5 {
        color: #808080;
      }
      .line6 {
        color: #cc3300;
      }
      .line7 {
        color: #993399;
      }
      .line8 {
        color: #000000;
      }
      .line9 {
        color: #008000;
        font-style: italic;
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <h1>절대반지는?</h1>

    <p class="line1">반지 세 개는 하늘 아래 요정왕들을 위한 것,</p>
    <hr class="hr1" />

    <p class="line2">일곱 개는 돌의 전당에 있는 난쟁이 군주들을 위한 것,</p>
    <hr class="hr2" />

    <p class="line3">아홉 개는 죽은 운명의 인간을 위한 것,</p>
    <hr class="hr3" />

    <p class="line4">하나는 암흑의 왕좌에 앉은 암흑 제왕을 위한 것,</p>
    <hr class="hr4" />

    <p class="line5">그곳은 망령들이 지배라는 모르도르의 땅,</p>
    <hr class="hr5" />

    <p class="line6">
      그 모든 반지를 다스릴 반지하나, 그 모든 반지를 찾기 위한 절대반지,
    </p>
    <hr class="hr6" />

    <p class="line7">그 모든 반지를 암흑 속에 가두기 위한 반지는 절대반지뿐,</p>
    <hr class="hr7" />

    <p class="line8">바로 망령들이 누워 있는 모르도르의 땅에</p>
    <hr class="hr8" />
    <p class="line9">반지의 제왕 중에서….</p>
  </body>
</html>
