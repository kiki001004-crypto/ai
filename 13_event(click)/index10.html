<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클릭이벤트</title>
    <style>
      .box {
        width: 1200px;
        display: flex;
        gap: 20px;
      }
      .box div {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
      }
      .orange {
        background: orange;
      }
      .lightblue {
        background: lightblue;
      }
      .lightpurple {
        background: #fd6f7d;
      }
    </style>
  </head>
  <body>
    <h1>자바스크립트 함수</h1>
    <button id="btn1">숨김</button>
    <button id="btn2">보이기</button>
    <button id="btn3">토글</button>
    <button id="btn4">늘리기</button>
    <button id="btn5">줄이기</button>
    <hr />
    <div class="box">
      <div class="orange">숨김/보이기</div>
      <div class="lightblue">토글</div>
      <div class="lightpurple">가로/세로크기</div>
    </div>

    <script>
      let btn1 = document.getElementById("btn1");
      console.log(btn1);
      //   버튼2
      let btn2 = document.getElementById("btn2");
      console.log(btn2);
      let box1 = document.querySelector(".box .orange");
      console.log(box1);
      //   클릭이벤트
      btn1.addEventListener("click", function () {
        box1.style.display = "none";
      });
      //   btn2 클릭 이벤트
      btn2.addEventListener("click", function () {
        // 숨겨진 요소 보게 하는 css 명령
        box1.style.display = "block";
      });
      //   toggle
      let btn3 = document.getElementById("btn3");
      console.log(btn3);
      let bluebox = document.querySelector(".box .lightblue");
      console.log(bluebox);
      //   toggle 버튼을 클릭하면 보이고/숨김
      btn3.addEventListener("click", function () {
        if (bluebox.style.display == "none") {
          // 참일때
          bluebox.style.display = "block";
        } else {
          bluebox.style.display = "none";
        }
      });

      //   버튼 4를 클릭하면 박스사이작 커지는 코드
      let btn4 = document.getElementById("btn4");
      let pbox = document.querySelector(".box .lightpurple");
      console.log(btn4, pbox);
      //   박스 크기 늘리는 이벤트
      btn4.addEventListener("click", function () {
        pbox.style.width = "600px";
        pbox.style.height = "600px";
      });
      btn5.addEventListener("click", function () {
        pbox.style.width = "200px";
        pbox.style.height = "200px";
      });
    </script>
  </body>
</html>
