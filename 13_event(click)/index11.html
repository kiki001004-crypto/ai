<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제이쿼리</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>자바스크립트 함수</h1>
    <button id="btn1">숨김</button>
    <button id="btn2">보이기</button>
    <button id="btn3">토글</button>
    <button id="btn4">늘리기</button>
    <button id="btn5">줄이기</button>
    <hr />
    <div class="box">
      <div class="orange">숨김/보이기</div>
      <div class="lightblue">토글</div>
      <div class="lightpurple">가로/세로크기</div>
    </div>
    <!-- 스크립트 라이브러리 연결(jquery 라이브러리) -->
    <script src="./script/jquery-4.0.0.js"></script>
    <script>
      $(function () {
        $("#btn1").css({ width: "100px", height: "200px" });

        $("#btn1").click(function () {
          $(".orange").hide();
        });

        $("#btn2").click(function () {
          $(".orange").show();
        });

        $("#btn3").click(function () {
          $(".lightblue").toggle();
        });

        $("#btn4").click(function () {
          $(".lightpurple").width(600);
          $(".lightpurple").height(600);
        });

        $("#btn5").click(function () {
          $(".lightpurple").width("200px");
          $(".lightpurple").height("200px");
        });
      });
    </script>
  </body>
</html>
