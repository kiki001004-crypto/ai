<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta

    />
    <title>MAISON - 장바구니</title>
    <link rel="stylesheet" href="./css/style.css" />

  <body>
    <div class="app-container">

        </section>

        <section class="summary-box">
          <div class="summary-row">
            <span>상품 금액</span><strong id="productAmount">₩0</strong>
          </div>
          <div class="summary-row">
            <span>배송비</span><strong id="shippingAmount">₩0</strong>
          </div>
          <div class="summary-row total">
            <span>총 결제금액</span><strong id="totalAmount">₩0</strong>
          </div>
          <button class="checkout-btn">주문하기</button>
        </section>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" href="index.html"
          ><svg
            width="22"
