<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MAISON - 카테고리</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header page-header">
        <a class="back-btn" href="index.html" aria-label="뒤로가기">←</a>
        <h1 class="subpage-title">카테고리</h1>
        <a
          class="icon-btn cart-btn link-btn"
          href="cart.html"
          aria-label="장바구니"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="badge">2</span>
        </a>
      </header>

      <main class="main-content page-category">
        <section class="section compact-top">
          <div class="chips-wrap" id="categoryTabs">
            <button class="filter-chip active" type="button" data-filter="all">
              전체
            </button>
            <button class="filter-chip" type="button" data-filter="의류">
              의류
            </button>
            <button class="filter-chip" type="button" data-filter="아우터">
              아우터
            </button>
            <button class="filter-chip" type="button" data-filter="원피스">
              원피스
            </button>
            <button class="filter-chip" type="button" data-filter="악세서리">
              악세서리
            </button>
            <button class="filter-chip" type="button" data-filter="신발">
              신발
            </button>
          </div>
        </section>

        <section class="section">
          <h2 id="categoryTitle" class="section-title">전체 상품</h2>
          <div class="product-list" id="categoryProducts"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" href="index.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline></svg
          ><span>홈</span></a
        >
        <a class="nav-item active" href="category.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect></svg
          ><span>카테고리</span></a
        >
        <a class="nav-item" href="cart.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path></svg
          ><span>장바구니</span></a
        >
        <a class="nav-item" href="mypage.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle></svg
          ><span>마이페이지</span></a
        >
      </nav>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
