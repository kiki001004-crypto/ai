<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MAISON - 홈</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <a class="logo-link" href="index.html"><h1 class="logo">MAISON</h1></a>
        <div class="header-icons">
          <button class="icon-btn" aria-label="검색">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
          <a
            class="icon-btn cart-btn link-btn"
            href="cart.html"
            aria-label="장바구니"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
              ></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="badge">2</span>
          </a>
          <button class="icon-btn" aria-label="알림">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="main-content page-home">
        <section class="hero-banner">
          <div>
            <p class="hero-label">SPRING CURATION</p>
            <h2>세련되고 가벼운<br />데일리 룩</h2>
          </div>
        </section>

        <div class="category-tabs-container">
          <div class="category-tabs">
            <a class="category-tab active" href="category.html">전체</a>
            <a class="category-tab" href="category.html#clothing">의류</a>
            <a class="category-tab" href="category.html#outer">아우터</a>
            <a class="category-tab" href="category.html#dress">원피스</a>
            <a class="category-tab" href="category.html#acc">악세서리</a>
            <a class="category-tab" href="category.html#shoes">신발</a>
          </div>
        </div>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">추천 상품</h2>
            <a class="more-link" href="category.html">전체보기</a>
          </div>
          <div class="product-grid" id="recommendedProducts"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">베스트 상품</h2>
            <a class="more-link" href="category.html">전체보기</a>
          </div>
          <div class="product-grid" id="bestProducts"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item active" href="index.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline></svg
          ><span>홈</span></a
        >
        <a class="nav-item" href="category.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect></svg
          ><span>카테고리</span></a
        >
        <a class="nav-item" href="cart.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path></svg
          ><span>장바구니</span></a
        >
        <a class="nav-item" href="mypage.html"
          ><svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle></svg
          ><span>마이페이지</span></a
        >
      </nav>
    </div>

    <script src="./script/script.js"></script>

</html>
