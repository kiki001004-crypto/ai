<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>양수,음수</title>
  </head>
  <body>
    <script>
      let mainus = prompt("숫자를 입력하세요?");

      if (mainus >= 100) {
        alert("양수");
      }
      if (mainus >= -10) {
        alert("음수");
      }
      document.write(`숫자는=${mainus}<br>`);
    </script>
  </body>
</html>
