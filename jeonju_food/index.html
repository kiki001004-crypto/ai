      const mockReviews = {
        1: [
          { name: "이지*", rating: 5, text: "재료가 신선하고 깔끔했어요." },
          { name: "박소*", rating: 5, text: "재료가 신선하고 깔끔했어요." },
          { name: "진정*", rating: 5, text: "재료가 신선하고 깔끔했어요." },
          { name: "진정*", rating: 5, text: "정말 맛있게 잘 먹고 갑니다." },
        ],
      };

      const app = {
        restaurants: [],
        currentPage: 1,
        itemsPerPage: 10,
        currentDetailId: null,
        selectedStar: 5,

        init: async function () {
          await this.fetchData();
          this.renderList();
          this.setupStarSelector();
        },

        // API 통신 및 Fallback
        fetchData: async function () {
          try {
            // 실제 전주시 공공데이터 API 연동 규격
            const apiUrl = `https://openapi.jeonju.go.kr/rest/jeonjufood?serviceKey=${CONFIG.JEONJU_API_KEY}&pageNo=1&numOfRows=20`;
            // API키가 입력되지 않았거나, 통신 제약(CORS 등)이 있을 경우를 위해 MockData 우선 사용
            if (CONFIG.JEONJU_API_KEY.includes("YOUR_"))
              throw new Error("API Key not set");

            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("API Request Failed");

            // XML 파싱 등의 로직이 필요하지만, 여기서는 데모를 위해 목업 사용으로 바로 넘깁니다.
            // 실제 환경에서는 response.text() -> DOMParser 로 파싱하여 this.restaurants 배열을 채웁니다.
            throw new Error("Using Mock Data for Demonstration");
          } catch (error) {
            console.log(
              "공공데이터 로드 실패 또는 미설정. 내부 목업 데이터를 사용합니다.",
              error.message,
            );
            this.restaurants = [...mockData];
          }
        },

        renderList: function () {
          const listContainer = document.getElementById("restaurant-list");
          listContainer.innerHTML = "";

          // 페이징 계산
          const startIndex = (this.currentPage - 1) * this.itemsPerPage;
          const endIndex = startIndex + this.itemsPerPage;
          const pagedData = this.restaurants.slice(startIndex, endIndex);
          const totalPages = Math.ceil(
            this.restaurants.length / this.itemsPerPage,
          );

          // 아이템 렌더링
          pagedData.forEach((item) => {
            // 인기 맛집 리스트 (2번째 아이템부터, 1번은 오늘의 추천)
            if (item.id === 1 && this.currentPage === 1) return;

            const div = document.createElement("div");
            div.className =
              "flex gap-3 cursor-pointer items-center border-b pb-3 mb-1";
            div.onclick = () => this.showDetail(item.id);

            div.innerHTML = `
                <img src="${item.img}" alt="${item.name}" class="w-32 h-24 object-cover rounded-lg">
                <div class="flex-1">
                    <h3 class="font-bold text-base">${item.name}</h3>
                    <p class="text-sm text-gray-700">${item.category}</p>
                    <p class="text-sm text-gray-600 mt-1">(${item.area}) · ★${item.rating}</p>
                </div>
            `;
            listContainer.appendChild(div);
          });

          // 페이징 UI 업데이트
          document.getElementById("page-info").innerText =
            `${this.currentPage} / ${totalPages}`;
          document.getElementById("btn-prev").disabled = this.currentPage === 1;
          document.getElementById("btn-next").disabled =
            this.currentPage === totalPages;
        },

        nextPage: function () {
          const totalPages = Math.ceil(
            this.restaurants.length / this.itemsPerPage,
          );
          if (this.currentPage < totalPages) {
            this.currentPage++;
            this.renderList();
            document.getElementById("view-list").scrollTo(0, 0);
          }
        },

        prevPage: function () {
          if (this.currentPage > 1) {
            this.currentPage--;
            this.renderList();
            document.getElementById("view-list").scrollTo(0, 0);
          }
        },

        showDetail: function (id) {
          this.currentDetailId = id;
          const item = this.restaurants.find((r) => r.id === id);
          if (!item) return;

          // 상세 정보 바인딩
          document.getElementById("detail-img").src = item.img;
          document.getElementById("detail-title").innerText = item.name;
          document.getElementById("detail-rating").innerText =
            `★ ${item.rating}`;
          document.getElementById("detail-review-count").innerText =
            `리뷰 ${item.reviewCnt}`;
          document.getElementById("detail-menu").innerText = item.menu;
          document.getElementById("detail-intro").innerText = item.intro;
          document.getElementById("detail-address").innerText = item.address;

          this.renderReviews();

          // 화면 전환
          document.getElementById("view-list").classList.add("hidden");
          document.getElementById("view-list").classList.remove("flex");

          const detailView = document.getElementById("view-detail");
          detailView.classList.remove("hidden");
          detailView.classList.add("flex");
          detailView.scrollTo(0, 0);
        },

        showList: function () {
          this.currentDetailId = null;
          document.getElementById("view-detail").classList.add("hidden");
          document.getElementById("view-detail").classList.remove("flex");

          document.getElementById("view-list").classList.remove("hidden");
          document.getElementById("view-list").classList.add("flex");
        },

        renderReviews: function () {
          const container = document.getElementById("detail-reviews");
          container.innerHTML = "";

          const reviews = mockReviews[this.currentDetailId] || [];

          if (reviews.length === 0) {
            container.innerHTML =
              '<p class="text-sm text-gray-500">첫 리뷰를 작성해주세요!</p>';
            return;
          }

          reviews.forEach((rv) => {
            let stars = "★".repeat(rv.rating) + "☆".repeat(5 - rv.rating);
            container.innerHTML += `
                <div class="border-b pb-3">
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm">${rv.name}</span>
                        <span class="text-black text-sm tracking-widest">${stars}</span>
                    </div>
                    <p class="text-sm text-gray-800 mt-1">${rv.text}</p>
                </div>
            `;
          });
        },

        openDirections: function () {
          const item = this.restaurants.find(
            (r) => r.id === this.currentDetailId,
          );
          if (!item) return;

          // 카카오맵 URL Scheme을 이용한 길찾기 (모바일 웹/앱 호환성이 가장 뛰어남)
          // 출발지를 지정하지 않으면 사용자의 현재 위치가 출발지가 됩니다.
          const kakaoMapUrl = `https://map.kakao.com/link/to/${item.name},${item.lat},${item.lng}`;
          window.open(kakaoMapUrl, "_blank");
        },

        // 리뷰 모달 관련
        openReviewModal: function () {
          document.getElementById("modal-review").classList.remove("hidden");
          document.getElementById("modal-review").classList.add("flex");
          this.selectedStar = 5;
          this.updateStarUI();
          document.getElementById("review-text").value = "";
        },

        closeReviewModal: function () {
          document.getElementById("modal-review").classList.add("hidden");
          document.getElementById("modal-review").classList.remove("flex");
        },

        setupStarSelector: function () {
          const stars = document.querySelectorAll("#star-selector i");
          stars.forEach((star) => {
            star.addEventListener("click", (e) => {
              this.selectedStar = parseInt(e.target.getAttribute("data-val"));
              this.updateStarUI();
            });
          });
        },

        updateStarUI: function () {
          const stars = document.querySelectorAll("#star-selector i");
          stars.forEach((star, index) => {
            if (index < this.selectedStar) {
              star.classList.replace("ph", "ph-fill");
            } else {
              star.classList.replace("ph-fill", "ph");
            }
          });
        },

        submitReview: function () {
          const text = document.getElementById("review-text").value.trim();
          if (!text) {
            alert("리뷰 내용을 입력해주세요.");
            return;
          }

          if (!mockReviews[this.currentDetailId]) {
            mockReviews[this.currentDetailId] = [];
          }

          // 새 리뷰 상단에 추가
          mockReviews[this.currentDetailId].unshift({
            name: "방문*", // 가상의 닉네임 마스킹
            rating: this.selectedStar,
            text: text,
          });

          // 리뷰 카운트 증가
          const item = this.restaurants.find(
            (r) => r.id === this.currentDetailId,
          );
          if (item) {
            item.reviewCnt += 1;
            document.getElementById("detail-review-count").innerText =
              `리뷰 ${item.reviewCnt}`;
          }

          this.renderReviews();
          this.closeReviewModal();
        },
      };

      // 앱 초기화
      window.onload = () => {
        app.init();
      };
    </script>
  </body>
</html>
