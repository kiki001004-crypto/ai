<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전주 로컬 맛집</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --card: #ffffff;
        --line: #e6e6e6;
        --text: #111111;
        --muted: #666666;
        --primary: #1f1f1f;
        --accent: #d35400;
        --accent-soft: #fff1e8;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      body {
        overflow-x: hidden;
      }

      .app {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        margin: 0 auto;
        background: #efefef;
        position: relative;
        overflow: hidden;
      }

      .screen {
        display: none;
        min-height: 100vh;
      }
      .screen.active {
        display: block;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 16px 8px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 800;
      }

      .title-wrap p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .icon-btn,
      .back-btn,
      .favorite-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
        cursor: pointer;
        font-size: 18px;
      }

      .favorite-btn.active {
        background: #fff3f3;
        color: #d83b52;
      }

      .search-box {
        margin: 10px 16px 14px;
        background: #fff;
        border-radius: 24px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      }

      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
      }

      .chips {
        display: flex;
        gap: 8px;
        padding: 0 16px 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }

      .chip {
        border: 1px solid #d9d9d9;
        background: #fff;
        padding: 8px 12px;
        border-radius: 999px;
        white-space: nowrap;
        cursor: pointer;
        color: #333;
      }

      .chip.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .section {
        padding: 8px 16px 12px;
      }
      .section h2 {
        margin: 6px 0 12px;
        font-size: 22px;
      }

      .hero-card,
      .list-card,
      .detail-card,
      .review-card,
      .pagination {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-card {
        cursor: pointer;
      }
      .hero-image,
      .thumb {
        width: 100%;
        object-fit: cover;
        display: block;
        background: #ddd;
      }
      .hero-image {
        height: 225px;
      }
      .thumb {
        width: 132px;
        height: 100px;
        border-radius: 14px;
        flex-shrink: 0;
      }

      .hero-content,
      .review-form,
      .review-list {
        padding: 14px;
      }

      .restaurant-name {
        font-weight: 800;
        font-size: 24px;
        margin: 0 0 8px;
      }

      .meta,
      .sub-meta {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        align-items: center;
      }

      .section-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 66px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #7b7b7b;
        color: #fff;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .list-wrap {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .list-card {
        display: flex;
        gap: 12px;
        padding: 12px;
        cursor: pointer;
        position: relative;
      }

      .card-favorite {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        z-index: 2;
      }

      .card-favorite.active {
        color: #d83b52;
      }

      .list-card h3 {
        margin: 0 0 8px;
        font-size: 19px;
        padding-right: 36px;
      }
      .list-card p {
        margin: 4px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .badge-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 6px;
        color: #333;
        font-size: 14px;
      }

      .pagination {
        margin: 16px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .page-btn {
        min-width: 40px;
        height: 40px;
        border: 1px solid #dcdcdc;
        background: #fff;
        border-radius: 12px;
        cursor: pointer;
        padding: 0 12px;
      }
      .page-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .page-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .floating-header {
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(
          180deg,
          rgba(239, 239, 239, 0.98),
          rgba(239, 239, 239, 0.88),
          rgba(239, 239, 239, 0)
        );
        backdrop-filter: blur(8px);
      }

      .detail-hero {
        padding: 0 16px;
        margin-top: -6px;
        position: relative;
      }

      .detail-hero img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 22px;
        display: block;
        box-shadow: var(--shadow);
        background: #ddd;
      }

      .hero-actions {
        position: absolute;
        top: 14px;
        right: 28px;
        display: flex;
        gap: 8px;
      }

      .detail-card {
        margin: 16px;
        padding: 16px;
      }

      .detail-block {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .detail-block:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }

      .detail-block ul {
        margin: 0;
        padding-left: 16px;
        color: #333;
        line-height: 1.6;
      }
      .detail-block p {
        margin: 0;
        line-height: 1.6;
      }

      .map-box {
        width: 100%;
        height: 260px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #fafafa;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .action-btn,
      .submit-btn {
        border: none;
        border-radius: 14px;
        padding: 14px 16px;
        cursor: pointer;
        font-weight: 700;
      }

      .action-btn.primary,
      .submit-btn {
        background: var(--primary);
        color: #fff;
      }
      .action-btn.secondary {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .review-card {
        margin: 0 16px 16px;
      }

      .review-form input,
      .review-form textarea,
      .review-form select {
        width: 100%;
        border: 1px solid #dadada;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: #fff;
        outline: none;
      }

      .review-form textarea {
        min-height: 110px;
        resize: vertical;
      }

      .review-item {
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }
      .review-item:first-child {
        border-top: none;
      }
      .review-item strong {
        font-size: 16px;
      }
      .review-item p {
        margin: 8px 0 0;
        color: #333;
        line-height: 1.55;
      }

      .rating {
        letter-spacing: 2px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 28px 14px;
      }
      .muted {
        color: var(--muted);
      }
      .loader {
        text-align: center;
        padding: 24px 0;
        color: var(--muted);
      }

      .error {
        margin: 16px;
        background: #fff4f2;
        color: #b33a2f;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #f1d6d2;
      }

      .bottom-nav {
        position: sticky;
        bottom: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        background: rgba(255, 255, 255, 0.96);
        border-top: 1px solid #ddd;
        backdrop-filter: blur(12px);
        z-index: 30;
      }

      .nav-btn {
        border: none;
        background: transparent;
        padding: 12px 4px 16px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
      }

      .nav-btn.active {
        color: var(--primary);
      }

      @media (min-width: 860px) {
        body {
          padding: 20px;
        }
        .app {
          max-width: 1080px;
          border-radius: 28px;
          box-shadow: var(--shadow);
          display: grid;
          grid-template-columns: 420px 1fr;
        }
        #listScreen {
          border-right: 1px solid var(--line);
        }
        .screen {
          min-height: calc(100vh - 40px);
        }
        .screen.active {
          display: block;
        }
        .floating-header {
          position: static;
          background: transparent;
        }
        .bottom-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="screen active" id="listScreen">
        <div class="topbar">
          <div class="title-wrap">
            <h1>전주 로컬 맛집</h1>
            <p>(한옥마을부터 남부시장까지)</p>
          </div>
          <button class="icon-btn" id="refreshBtn" title="새로고침">↻</button>
        </div>

        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="맛집/메뉴 검색" />
        </div>

        <div class="chips" id="categoryChips"></div>

        <div class="section">
          <h2 id="featuredTitle">오늘의 추천</h2>
          <div id="featuredArea"></div>
        </div>

        <div class="section">
          <h2 id="listTitle">인기 맛집</h2>
          <div id="errorArea"></div>
          <div id="listArea" class="list-wrap"></div>
        </div>

        <div class="pagination" id="pagination"></div>

        <nav class="bottom-nav">
          <button class="nav-btn active" data-tab="all">☰<br />전체</button>
          <button class="nav-btn" data-tab="favorite">♡<br />즐겨찾기</button>
          <button class="nav-btn" data-tab="recommend">📍<br />추천</button>
        </nav>
      </section>

      <section class="screen" id="detailScreen">
        <div class="floating-header">
          <button class="back-btn" id="backBtn">←</button>
          <button class="icon-btn" id="routeTopBtn">길찾기</button>
        </div>

        <div class="detail-hero" id="detailHero"></div>
        <div class="detailCardWrap">
          <div class="detail-card" id="detailCard"></div>
        </div>

        <div class="review-card">
          <div class="review-form">
            <div class="section-label">리뷰 작성</div>
            <input
              type="text"
              id="reviewAuthor"
              placeholder="작성자 이름"
              maxlength="20"
            />
            <select id="reviewRating">
              <option value="5">★★★★★ (5점)</option>
              <option value="4">★★★★☆ (4점)</option>
              <option value="3">★★★☆☆ (3점)</option>
              <option value="2">★★☆☆☆ (2점)</option>
              <option value="1">★☆☆☆☆ (1점)</option>
            </select>
            <textarea
              id="reviewText"
              placeholder="리뷰를 남겨주세요"
            ></textarea>
            <button class="submit-btn" id="submitReviewBtn">
              리뷰 작성하기
            </button>
          </div>
          <div class="review-list" id="reviewList"></div>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        JEONJU_API_KEY:
          "c396d7fec4c202142c2c83f4d72a60e831b50c2bea1f0db3df46ac266a8615aa",
        KAKAO_JAVASCRIPT_KEY: "2631fbface8acace856d0e9bd3bddd6a",
        API_BASE_URL: "https://openapi.jeonju.go.kr/rest/jeonjufood",
        ITEMS_PER_PAGE: 10,
        DEFAULT_IMAGE:
          "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=1200&q=80",
        IMAGE_ENDPOINT: "getFoodImgList",
        ENDPOINTS: {
          all: "getHanokList",
          baekban: "getBaekbanList",
          bibimbap: "getBibimbapList",
          gukbap: "getBeanSproutRiceSoupList",
          hansik: "getHansikList",
          makgeolli: "getMakgeolliList",
          hanok: "getHanokList",
        },
      };

      const STORAGE_KEYS = {
        favorites: "jeonju-food-favorites",
      };

      const STATE = {
        restaurants: [],
        filteredRestaurants: [],
        currentPage: 1,
        currentCategory: "all",
        currentTab: "all",
        keyword: "",
        selectedRestaurant: null,
        map: null,
        marker: null,
        kakaoReady: false,
      };

      const CATEGORY_OPTIONS = [
        { key: "all", label: "[전체]" },
        { key: "baekban", label: "[백반]" },
        { key: "bibimbap", label: "[비빔밥]" },
        { key: "gukbap", label: "[국밥]" },
        { key: "hansik", label: "[한정식]" },
        { key: "makgeolli", label: "[막걸리]" },
        { key: "hanok", label: "[한옥마을]" },
      ];

      const els = {
        listScreen: document.getElementById("listScreen"),
        detailScreen: document.getElementById("detailScreen"),
        searchInput: document.getElementById("searchInput"),
        categoryChips: document.getElementById("categoryChips"),
        featuredArea: document.getElementById("featuredArea"),
        listArea: document.getElementById("listArea"),
        pagination: document.getElementById("pagination"),
        errorArea: document.getElementById("errorArea"),
        detailHero: document.getElementById("detailHero"),
        detailCard: document.getElementById("detailCard"),
        reviewList: document.getElementById("reviewList"),
        reviewAuthor: document.getElementById("reviewAuthor"),
        reviewRating: document.getElementById("reviewRating"),
        reviewText: document.getElementById("reviewText"),
        featuredTitle: document.getElementById("featuredTitle"),
        listTitle: document.getElementById("listTitle"),
      };

      document.addEventListener("DOMContentLoaded", async () => {
        renderCategoryChips();
        bindEvents();
        await loadKakaoMapSdk();
        await loadRestaurants();
      });

      function bindEvents() {
        document
          .getElementById("refreshBtn")
          .addEventListener("click", loadRestaurants);
        document
          .getElementById("backBtn")
          .addEventListener("click", showListScreen);
        document
          .getElementById("routeTopBtn")
          .addEventListener("click", openKakaoRoute);
        document
          .getElementById("submitReviewBtn")
          .addEventListener("click", handleReviewSubmit);

        els.searchInput.addEventListener("input", (e) => {
          STATE.keyword = e.target.value.trim();
          STATE.currentPage = 1;
          applyFilters();
        });

        document.querySelectorAll(".nav-btn").forEach((button) => {
          button.addEventListener("click", () => {
            const tab = button.dataset.tab;
            STATE.currentTab = tab;
            STATE.currentPage = 1;
            document.querySelectorAll(".nav-btn").forEach((btn) => {
              btn.classList.toggle("active", btn.dataset.tab === tab);
            });
            applyFilters();
          });
        });
      }

      function renderCategoryChips() {
        els.categoryChips.innerHTML = CATEGORY_OPTIONS.map(
          (category) => `
      <button class="chip ${STATE.currentCategory === category.key ? "active" : ""}" data-category="${category.key}">
        ${category.label}
      </button>
    `,
        ).join("");

        document.querySelectorAll(".chip").forEach((button) => {
          button.addEventListener("click", async () => {
            const nextCategory = button.dataset.category;
            if (STATE.currentCategory === nextCategory) return;
            STATE.currentCategory = nextCategory;
            STATE.currentPage = 1;
            renderCategoryChips();
            await loadRestaurants();
          });
        });
      }

      async function loadRestaurants() {
        clearError();
        els.listArea.innerHTML =
          '<div class="loader">맛집 정보를 불러오는 중입니다...</div>';
        els.featuredArea.innerHTML =
          '<div class="loader">추천 맛집을 준비 중입니다...</div>';

        const hasApiKey =
          CONFIG.JEONJU_API_KEY && !CONFIG.JEONJU_API_KEY.includes("YOUR_");

        if (!hasApiKey) {
          STATE.restaurants = mergeStoredMeta(getFallbackRestaurants());
          applyFilters();
          return;
        }

        try {
          const endpoint =
            CONFIG.ENDPOINTS[STATE.currentCategory] || CONFIG.ENDPOINTS.all;
          const rawList = await fetchRestaurantList(endpoint);
          let list = normalizeRestaurantList(rawList);
          list = await enrichRestaurantsWithImages(list);
          STATE.restaurants = mergeStoredMeta(list);
          applyFilters();
        } catch (error) {
          console.error(error);

          const isFileProtocol = location.protocol === "file:";
          const message = isFileProtocol
            ? "현재 file:// 방식으로 실행 중이라 API 호출이 차단되었습니다. Live Server 또는 localhost 환경에서 실행해주세요."
            : "실제 API 연결에 실패하여 샘플 데이터로 표시 중입니다. 인증키, 엔드포인트명, 브라우저 CORS 환경을 확인해주세요.";

          showError(message);
          STATE.restaurants = mergeStoredMeta(getFallbackRestaurants());
          applyFilters();
        }
      }

      async function fetchRestaurantList(endpointName) {
        const url = `${CONFIG.API_BASE_URL}/${endpointName}?authApiKey=${encodeURIComponent(CONFIG.JEONJU_API_KEY)}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const contentType = response.headers.get("content-type") || "";
        const rawText = await response.text();

        if (
          contentType.includes("json") ||
          rawText.trim().startsWith("{") ||
          rawText.trim().startsWith("[")
        ) {
          return JSON.parse(rawText);
        }

        return parseXmlToJson(rawText);
      }

      async function fetchFoodImages(foodUid) {
        if (!foodUid) return [];

        const url = `${CONFIG.API_BASE_URL}/${CONFIG.IMAGE_ENDPOINT}?authApiKey=${encodeURIComponent(CONFIG.JEONJU_API_KEY)}&foodUid=${encodeURIComponent(foodUid)}`;
        const response = await fetch(url);

        if (!response.ok) return [];

        const contentType = response.headers.get("content-type") || "";
        const rawText = await response.text();

        let payload;
        if (
          contentType.includes("json") ||
          rawText.trim().startsWith("{") ||
          rawText.trim().startsWith("[")
        ) {
          payload = JSON.parse(rawText);
        } else {
          payload = parseXmlToJson(rawText);
        }

        const list = extractList(payload);
        return list.map((item) => ({
          thumbUrl: pick(item, ["thumbUrl"]),
          previewUrl: pick(item, ["privewUrl", "previewUrl"]),
        }));
      }

      async function enrichRestaurantsWithImages(restaurants) {
        const tasks = restaurants.slice(0, 12).map(async (restaurant) => {
          if (!restaurant.foodUid || restaurant.image !== CONFIG.DEFAULT_IMAGE)
            return restaurant;

          try {
            const images = await fetchFoodImages(restaurant.foodUid);
            if (images.length) {
              restaurant.image =
                images[0].previewUrl || images[0].thumbUrl || restaurant.image;
            }
          } catch (error) {
            console.warn("image load fail", error);
          }

          return restaurant;
        });

        await Promise.all(tasks);
        return restaurants;
      }

      function parseXmlToJson(xmlText) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const errorNode = xml.querySelector("parsererror");

        if (errorNode) {
          throw new Error("XML 파싱 실패");
        }

        const items = Array.from(xml.querySelectorAll("list, item, row, data"));
        if (!items.length) {
          return xmlNodeToObject(xml.documentElement);
        }

        return items.map((item) => xmlNodeToObject(item));
      }

      function xmlNodeToObject(node) {
        const obj = {};

        Array.from(node.children).forEach((child) => {
          const key = child.nodeName;
          const value = child.children.length
            ? xmlNodeToObject(child)
            : child.textContent.trim();

          if (obj[key] !== undefined) {
            if (!Array.isArray(obj[key])) obj[key] = [obj[key]];
            obj[key].push(value);
          } else {
            obj[key] = value;
          }
        });

        return obj;
      }

      function normalizeRestaurantList(payload) {
        const rawList = extractList(payload);

        return rawList.map((item, index) => {
          const foodUid = pick(item, ["foodUid", "uid", "id", "dataSid"]);
          const name =
            pick(item, [
              "title",
              "name",
              "foodNm",
              "restNm",
              "bizName",
              "subject",
              "업소명",
            ]) || `전주 맛집 ${index + 1}`;
          const uid = foodUid || `${name}-${index}`;
          const roadAddr = pick(item, ["roadAddr", "addrRoad", "도로명주소"]);
          const jibunAddr = pick(item, ["jibunAddr", "지번주소"]);
          const address =
            pick(item, ["addr", "address", "addr1", "업소위치"]) ||
            roadAddr ||
            jibunAddr ||
            "전주시 상세 주소 정보 없음";
          const menu =
            pick(item, [
              "menu",
              "mainMenu",
              "foodMenu",
              "signatureMenu",
              "품목",
            ]) || "대표 메뉴 정보 준비 중";
          const tel =
            pick(item, ["tel", "phone", "contact", "전화번호", "연락처"]) ||
            "전화번호 정보 없음";
          const intro =
            pick(item, ["contents", "intro", "desc", "summary"]) ||
            "전주의 로컬 맛집 정보를 제공합니다.";
          const x =
            toNumber(pick(item, ["lng", "mapX", "longitude", "x", "경도"])) ||
            127.148;
          const y =
            toNumber(pick(item, ["lat", "mapY", "latitude", "y", "위도"])) ||
            35.824;
          const image =
            pick(item, [
              "thumbUrl",
              "previewUrl",
              "privewUrl",
              "imgUrl",
              "image",
              "thumbnail",
            ]) || CONFIG.DEFAULT_IMAGE;
          const category = inferCategory(item, name, menu);
          const reviews = getReviews(uid);
          const stats = calculateReviewStats(reviews);

          return {
            uid,
            foodUid,
            name,
            address,
            roadAddr,
            jibunAddr,
            menu,
            tel,
            intro,
            image,
            category,
            avgRating: stats.avgRating,
            ratingCount: stats.ratingCount,
            reviewCount: reviews.length,
            x,
            y,
            isFavorite: isFavorite(uid),
            raw: item,
          };
        });
      }

      function extractList(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== "object") return [];

        const candidates = [
          payload.list,
          payload.items,
          payload.item,
          payload.data,
          payload.rows,
          payload.result,
          payload.body && payload.body.items,
          payload.response &&
            payload.response.body &&
            payload.response.body.items,
        ];

        for (const candidate of candidates) {
          if (Array.isArray(candidate)) return candidate;
          if (candidate && Array.isArray(candidate.item)) return candidate.item;
          if (candidate && Array.isArray(candidate.list)) return candidate.list;
        }

        const nestedArrays = findAllArrays(payload);
        return nestedArrays[0] || [];
      }

      function findAllArrays(obj, found = []) {
        if (!obj || typeof obj !== "object") return found;

        Object.values(obj).forEach((value) => {
          if (Array.isArray(value)) {
            found.push(value);
          } else if (value && typeof value === "object") {
            findAllArrays(value, found);
          }
        });

        return found;
      }

      function pick(obj, keys) {
        if (!obj) return "";

        const lowerMap = {};
        Object.keys(obj).forEach((key) => {
          lowerMap[key.toLowerCase()] = obj[key];
        });

        for (const key of keys) {
          if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "")
            return obj[key];

          const lower = key.toLowerCase();
          if (
            lowerMap[lower] !== undefined &&
            lowerMap[lower] !== null &&
            lowerMap[lower] !== ""
          ) {
            return lowerMap[lower];
          }
        }

        return "";
      }

      function toNumber(value) {
        const num = Number(String(value).replace(/,/g, "").trim());
        return Number.isFinite(num) ? num : null;
      }

      function inferCategory(item, name, menu) {
        const source = `${JSON.stringify(item)} ${name} ${menu}`;

        if (/백반/.test(source)) return "백반";
        if (/비빔밥/.test(source)) return "비빔밥";
        if (/콩나물|국밥/.test(source)) return "국밥";
        if (/막걸리/.test(source)) return "막걸리";
        if (/한정식/.test(source)) return "한정식";
        if (/한옥/.test(source)) return "전주한옥마을";

        return "전주 로컬 맛집";
      }

      function applyFilters() {
        const keyword = STATE.keyword.toLowerCase();
        const favoriteOnly = STATE.currentTab === "favorite";
        const recommendOnly = STATE.currentTab === "recommend";

        let filtered = STATE.restaurants.filter((restaurant) => {
          const matchKeyword =
            !keyword ||
            [
              restaurant.name,
              restaurant.address,
              restaurant.menu,
              restaurant.category,
            ]
              .join(" ")
              .toLowerCase()
              .includes(keyword);

          const matchFavorite = !favoriteOnly || restaurant.isFavorite;
          const matchRecommend = !recommendOnly || restaurant.avgRating >= 4.7;

          return matchKeyword && matchFavorite && matchRecommend;
        });

        filtered.sort((a, b) => {
          return b.avgRating - a.avgRating || b.reviewCount - a.reviewCount;
        });

        STATE.filteredRestaurants = filtered;
        renderSectionTitles();
        renderFeatured();
        renderList();
        renderPagination();
      }

      function renderPagination() {
        const totalPages = Math.max(
          1,
          Math.ceil(STATE.filteredRestaurants.length / CONFIG.ITEMS_PER_PAGE),
        );

        if (!STATE.filteredRestaurants.length) {
          els.pagination.innerHTML = "";
          return;
        }

        const pageNumbers = getVisiblePages(STATE.currentPage, totalPages, 10);
        const showPrevGroup = pageNumbers[0] > 1;
        const showNextGroup = pageNumbers[pageNumbers.length - 1] < totalPages;

        els.pagination.innerHTML = `
      <button class="page-btn" ${STATE.currentPage === 1 ? "disabled" : ""} data-page="prev">이전</button>
      ${showPrevGroup ? `<button class="page-btn" data-page="${pageNumbers[0] - 1}">...</button>` : ""}
      ${pageNumbers
        .map(
          (page) => `
        <button class="page-btn ${page === STATE.currentPage ? "active" : ""}" data-page="${page}">
          ${page}
        </button>
      `,
        )
        .join("")}
      ${showNextGroup ? `<button class="page-btn" data-page="${pageNumbers[pageNumbers.length - 1] + 1}">...</button>` : ""}
      <button class="page-btn" ${STATE.currentPage === totalPages ? "disabled" : ""} data-page="next">다음</button>
    `;

        els.pagination.querySelectorAll(".page-btn").forEach((button) => {
          button.addEventListener("click", () => {
            const type = button.dataset.page;

            if (type === "prev" && STATE.currentPage > 1) {
              STATE.currentPage -= 1;
            } else if (type === "next" && STATE.currentPage < totalPages) {
              STATE.currentPage += 1;
            } else if (!Number.isNaN(Number(type))) {
              STATE.currentPage = Number(type);
            }

            renderList();
            renderPagination();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });
      }

      function getVisiblePages(current, total, maxVisible) {
        const groupIndex = Math.floor((current - 1) / maxVisible);
        const start = groupIndex * maxVisible + 1;
        const end = Math.min(total, start + maxVisible - 1);

        const pages = [];
        for (let i = start; i <= end; i += 1) {
          pages.push(i);
        }

        return pages;
      }

      async function loadKakaoMapSdk() {
        if (window.kakao && window.kakao.maps) {
          STATE.kakaoReady = true;
          return;
        }

        if (
          !CONFIG.KAKAO_JAVASCRIPT_KEY ||
          CONFIG.KAKAO_JAVASCRIPT_KEY.includes("YOUR_")
        ) {
          console.warn("카카오 JavaScript 키를 설정하지 않았습니다.");
          return;
        }

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JAVASCRIPT_KEY}&autoload=false`;

          script.onload = () => {
            window.kakao.maps.load(() => {
              STATE.kakaoReady = true;
              resolve();
            });
          };

          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      function renderMap(restaurant) {
        const mapContainer = document.getElementById("map");
        if (!mapContainer) return;

        if (!STATE.kakaoReady || !window.kakao || !window.kakao.maps) {
          mapContainer.innerHTML =
            '<div class="empty">카카오맵 키를 입력하면 지도와 길찾기가 동작합니다.</div>';
          return;
        }

        const center = new kakao.maps.LatLng(restaurant.y, restaurant.x);
        STATE.map = new kakao.maps.Map(mapContainer, { center, level: 3 });
        STATE.marker = new kakao.maps.Marker({ position: center });
        STATE.marker.setMap(STATE.map);

        const info = new kakao.maps.InfoWindow({
          content: `<div style="padding:8px 10px; font-size:13px;">${escapeHtml(restaurant.name)}</div>`,
        });

        info.open(STATE.map, STATE.marker);
      }

        const restaurant = STATE.selectedRestaurant;
        if (!restaurant) return;

        const url = `https://map.kakao.com/link/to/${encodeURIComponent(restaurant.name)},${restaurant.y},${restaurant.x}`;
        window.open(url, "_blank");

      function handleReviewSubmit() {
        const restaurant = STATE.selectedRestaurant;
        if (!restaurant) return;

        const author = els.reviewAuthor.value.trim();
        const rating = Number(els.reviewRating.value);
        const content = els.reviewText.value.trim();

        if (!author || !content) {
          alert("작성자와 리뷰 내용을 입력해주세요.");
          return;
        }

        const reviews = getReviews(restaurant.uid);
        reviews.unshift({
          author,
          rating,
          content,
          createdAt: new Date().toLocaleString("ko-KR"),
        });

        localStorage.setItem(
          getReviewStorageKey(restaurant.uid),
          JSON.stringify(reviews),
        );

        els.reviewAuthor.value = "";
        els.reviewRating.value = "5";
        els.reviewText.value = "";

        updateRestaurantMeta(restaurant.uid);
        renderReviews(restaurant.uid);
        renderDetail(STATE.selectedRestaurant);
        renderFeatured();
        renderList();
      }

      function renderReviews(uid) {
        const reviews = getReviews(uid);

        if (!reviews.length) {
          els.reviewList.innerHTML =
            '<div class="empty">첫 리뷰를 남겨보세요.</div>';
          return;
        }

        els.reviewList.innerHTML = reviews
          .map(
            (review) => `

        <div class="meta" style="justify-content:space-between; gap:10px;">
          <strong>${escapeHtml(review.author)}</strong>
          <span class="rating">${"★".repeat(review.rating)}${"☆".repeat(5 - review.rating)}</span>
        </div>

      function updateRestaurantMeta(uid) {
        const restaurant = STATE.restaurants.find(
          (item) => String(item.uid) === String(uid),
        );
        if (!restaurant) return;

        const reviews = getReviews(uid);
        const stats = calculateReviewStats(reviews);

        restaurant.reviewCount = reviews.length;
        restaurant.avgRating = stats.avgRating;
        restaurant.ratingCount = stats.ratingCount;
        restaurant.isFavorite = isFavorite(uid);

        if (
          STATE.selectedRestaurant &&
          String(STATE.selectedRestaurant.uid) === String(uid)
        ) {
          STATE.selectedRestaurant = restaurant;
        }

        applyFilters();
      }

      function calculateReviewStats(reviews) {
        if (!reviews.length) {
          return { avgRating: 4.5, ratingCount: 0 };
        }

        const avg =
          reviews.reduce((sum, review) => sum + Number(review.rating || 0), 0) /
          reviews.length;
        return {
          avgRating: Math.round(avg * 10) / 10,
          ratingCount: reviews.length,
        };
      }

      function getReviewStorageKey(uid) {
        return `jeonju-food-reviews-${uid}`;
      }

      function getReviews(uid) {
        try {
          return JSON.parse(
            localStorage.getItem(getReviewStorageKey(uid)) || "[]",
          );
        } catch {
          return [];
        }
      }

      function getFavorites() {
        try {
          return JSON.parse(
            localStorage.getItem(STORAGE_KEYS.favorites) || "[]",
          );
        } catch {
          return [];
        }
      }

      function isFavorite(uid) {
        return getFavorites().includes(String(uid));
      }

      function toggleFavorite(uid, rerenderDetail = false) {
        const favorites = new Set(getFavorites());
        const key = String(uid);

        if (favorites.has(key)) {
          favorites.delete(key);
        } else {
          favorites.add(key);
        }

        localStorage.setItem(
          STORAGE_KEYS.favorites,
          JSON.stringify([...favorites]),
        );

        STATE.restaurants.forEach((restaurant) => {
          if (String(restaurant.uid) === key) {
            restaurant.isFavorite = favorites.has(key);
          }
        });

        if (
          STATE.selectedRestaurant &&
          String(STATE.selectedRestaurant.uid) === key
        ) {
          STATE.selectedRestaurant.isFavorite = favorites.has(key);
          if (rerenderDetail) {
            renderDetail(STATE.selectedRestaurant);
          }
        }

        applyFilters();
      }

      function mergeStoredMeta(restaurants) {
        return restaurants.map((restaurant) => {
          const reviews = getReviews(restaurant.uid);
          const stats = calculateReviewStats(reviews);

          return {
            ...restaurant,
            reviewCount: reviews.length,
            avgRating: stats.avgRating,
            ratingCount: stats.ratingCount,
            isFavorite: isFavorite(restaurant.uid),
          };
        });
      }

      function showError(message) {
        els.errorArea.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
      }

      function clearError() {
        els.errorArea.innerHTML = "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeHtmlAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      function shortAddress(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        return text.length > 26 ? `${text.slice(0, 26)}...` : text;
      }
