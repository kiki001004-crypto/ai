<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트 랜딩 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="flex flex-col items-center pt-[90px] pb-[100px]">
    <!-- 헤더 타이틀 -->
    <h1 class="text-[36px] font-normal mb-10 text-center tracking-tight">
      매일 밤 <span class="font-bold">10시</span> 이벤트가 시작됩니다!
    </h1>

    <!-- 카운트다운 타이머 -->
    <div class="flex items-center space-x-3 text-[64px] font-bold mb-12">
      <div class="flex space-x-[4px]">
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="hour1">1</span>
        </div>
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="hour2">0</span>
        </div>
      </div>
      <div
        class="text-[#24182E] pb-2 mx-2 text-[48px] tracking-widest font-black"
      >
        :
      </div>
      <div class="flex space-x-[4px]">
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="min1">0</span>
        </div>
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="min2">0</span>
        </div>
      </div>
      <div
        class="text-[#24182E] pb-2 mx-2 text-[48px] tracking-widest font-black"
      >
        :
      </div>
      <div class="flex space-x-[4px]">
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="sec1">0</span>
        </div>
        <div class="flip-card w-[65px] h-[95px] shadow-lg">
          <span id="sec2">2</span>
        </div>
      </div>
    </div>

    <!-- 검색창 힌트 -->
    <div class="flex items-center space-x-4 mb-[60px] text-[14px]">
      <span class="text-[#a19dad]"
        >회원님이 보다 빠르게 정답을 찾을 수 있도록</span
      >
      <a
        href="https://www.naver.com"
        target="_blank"
        class="border-[2px] border-[#22C55E] bg-white text-[#22C55E] font-medium px-3 py-[4px] flex items-center justify-between w-[240px] rounded-[2px] shadow-sm cursor-pointer hover:bg-gray-50 transition-colors"
      >
        <span>초록 검색창을 띄워두세요!</span>
        <span class="text-[10px]">▼</span>
      </a>
    </div>

    <!-- 940px 이너박스 -->
    <div class="inner-box shadow-xl">
      <!-- 질문 영역 -->
      <div class="text-center mt-[60px] mb-[45px] w-full">
        <p class="text-[18px] font-medium mb-1">
          Q. 4월 13일 문제 : 커넥츠에서 등업을 하려면 어떤 신청을 해야 할까요?
        </p>
        <p class="text-[16px] font-normal text-[#a19dad]">
          (힌트 : OOO신청 / 3글자)
        </p>
      </div>

      <!-- 상품 그리드 (가로 3열, 카드 234x330, 상하좌우 간격 20px) -->
      <div class="flex flex-wrap justify-center gap-[20px] w-full mb-[40px]">
        <!-- 상품 1 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="a5100"
            class="product-radio hidden"
            checked
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              소니 미러리스 A5100
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/sony.jpg"
                alt="소니 미러리스"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_1"
                  >3</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>

        <!-- 상품 2 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="shilla"
            class="product-radio hidden"
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              신라호텔 더 파크 뷰 식사권 2인
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/shilla.png"
                alt="신라호텔 더 파크 뷰 식사권"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_2"
                  >1</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>

        <!-- 상품 3 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="hdd"
            class="product-radio hidden"
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              외장하드 1TB
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/1TB.jpg"
                alt="외장하드"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_3"
                  >10</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>

        <!-- 상품 4 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="lamy"
            class="product-radio hidden"
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              라미 만년필
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/LAMY.jpg"
                alt="라미 만년필"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_4"
                  >3</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>

        <!-- 상품 5 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="giftcard"
            class="product-radio hidden"
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              백화점 상품권 1만원
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/man.png"
                alt="백화점 상품권 1만원"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_5"
                  >20</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>

        <!-- 상품 6 -->
        <label class="cursor-pointer relative group block">
          <input
            type="radio"
            name="product"
            value="banana"
            class="product-radio hidden"
          />
          <div
            class="card-content w-[234px] h-[330px] bg-white text-black flex flex-col items-center border-2 border-transparent transition-all"
          >
            <h3 class="text-[13px] font-bold mt-[35px] text-center w-full">
              바나나맛 우유
            </h3>
            <div class="img-placeholder my-auto">
              <img
                src="./images/banana.png"
                alt="바나나맛 우유"
                class="w-full h-full object-contain"
                onerror="this.style.display = 'none'"
              />
            </div>
            <div class="flex flex-col items-center w-full">
              <p class="text-[13px] font-bold text-[#333333] mb-[15px]">
                <span
                  class="text-[#8B5CF6] text-[24px] font-black mr-[2px] data-stock"
                  data-id="item_6"
                  >100</span
                >개 남음
              </p>
              <div class="w-[190px] h-[1px] bg-gray-200 mb-[18px]"></div>
              <div
                class="w-[16px] h-[16px] rounded-full border border-gray-300 mb-[30px] flex items-center justify-center radio-circle"
              >
                <div
                  class="w-[8px] h-[8px] rounded-full bg-transparent radio-inner transition-colors"
                ></div>
              </div>
            </div>
          </div>
        </label>
      </div>

      <!-- 응모하기 링크 (모달 호출로 변경) -->
      <button
        onclick="openModal()"
        class="w-[520px] h-[64px] bg-[#7D32F5] hover:bg-[#6A28D8] text-white flex items-center justify-center text-[20px] font-bold mb-[70px] transition duration-200 shadow-md border-none outline-none cursor-pointer"
      >
        응모하기
      </button>
    </div>

    <!-- 응모 폼 모달 영역 -->
    <div
      id="applyModal"
      class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center"
    >
      <div
        class="bg-white rounded-[8px] w-[400px] p-[30px] text-black relative shadow-2xl"
      >
        <!-- 닫기 버튼 -->
        <button
          onclick="closeModal()"
          class="absolute top-[20px] right-[20px] text-gray-400 hover:text-black border-none bg-transparent cursor-pointer"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>

        <h2 class="text-[22px] font-bold mb-6 text-center text-[#30273F]">
          이벤트 응모
        </h2>

        <!-- 입력 폼 섹션 -->
        <div id="modalFormSection">
          <div class="mb-4">
            <label class="block text-[14px] font-medium text-gray-700 mb-2"
              >이름</label
            >
            <input
              type="text"
              id="name"
              name="name"
              placeholder="이름을 입력해주세요"
              class="w-full border border-gray-300 rounded-[4px] px-3 py-3 outline-none focus:border-[#7D32F5] text-[14px]"
            />
          </div>
          <div class="mb-4">
            <label class="block text-[14px] font-medium text-gray-700 mb-2"
              >연락처</label
            >
            <input
              type="text"
              id="tel"
              name="tel"
              placeholder="010-0000-0000"
              class="w-full border border-gray-300 rounded-[4px] px-3 py-3 outline-none focus:border-[#7D32F5] text-[14px]"
            />
          </div>
          <div class="mb-4">
            <label class="block text-[14px] font-medium text-gray-700 mb-2"
              >이메일</label
            >
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              class="w-full border border-gray-300 rounded-[4px] px-3 py-3 outline-none focus:border-[#7D32F5] text-[14px]"
            />
          </div>
          <div class="mb-6">
            <label class="block text-[14px] font-medium text-gray-700 mb-2"
              >선택상품</label
            >
            <input
              type="text"
              id="choice"
              name="choice"
              readonly
              class="w-full border border-gray-300 bg-gray-100 rounded-[4px] px-3 py-3 outline-none text-gray-500 text-[14px] cursor-not-allowed"
            />
          </div>

          <!-- 커스텀 에러 메시지 표출 영역 -->
          <p
            id="modalError"
            class="hidden text-red-500 text-[13px] mb-4 text-center font-medium"
          ></p>

          <button
            id="submitBtn"
            onclick="submitApplication()"
            class="w-full bg-[#7D32F5] text-white py-3 rounded-[4px] font-bold text-[16px] hover:bg-[#6A28D8] transition-colors border-none cursor-pointer"
          >
            응모 완료
          </button>
        </div>

        <!-- 응모 완료 메시지 섹션 (alert 대체용 커스텀 메시지 박스) -->
        <div id="modalMessageSection" class="hidden text-center py-4">
          <div
            class="w-[60px] h-[60px] bg-green-100 text-[#22C55E] rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
          </div>
          <h3 class="text-[20px] font-bold mb-2 text-gray-800">
            응모가 완료되었습니다!
          </h3>
          <p class="text-gray-500 mb-8 text-[14px]">
            당첨자 발표일을 기대해 주세요.
          </p>
          <button
            onclick="closeModal()"
            class="w-full bg-gray-200 text-gray-800 py-3 rounded-[4px] font-bold text-[16px] hover:bg-gray-300 transition-colors border-none cursor-pointer"
          >
            확인
          </button>
        </div>
      </div>
    </div>
    <script src="./js/ailanding.js"></script>
  </body>
</html>
