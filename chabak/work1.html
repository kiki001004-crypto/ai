<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>차박 온보딩</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Noto Sans KR"', "sans-serif"],
            },
            colors: {
              brand: {
                dark: "#344669" /* 차박, 어디로 텍스트 색상 */,
                sub: "#6B7FAD" /* 서브 텍스트 색상 */,
                text: "#8899BD" /* 본문 텍스트 색상 */,
                primary: "#546EA8" /* 버튼 및 활성 도트 색상 */,
                dot: "#E2E6F0" /* 비활성 도트 색상 */,
                bg: "#F4F6F9" /* 일러스트 배경 삼각형 색상 */,
              },
            },
          },
        },
      };
    </script>
    <style>
      /* 모바일 환경 최적화 스타일 */
      body {
        background-color: #e5e7eb; /* 화면 밖 배경 (데스크톱 뷰어용) */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      #app-container {
        width: 100%;
        max-width: 400px; /* 일반적인 모바일 최대 너비 */
        height: 100dvh; /* 동적 뷰포트 높이 지원 */
        max-height: 850px;
        background-color: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
      }
      /* 페이드 애니메이션 클래스 */
      .fade-out {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
      .fade-in {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }
      /* 단어 단위 줄바꿈 방지 */
      .keep-all {
        word-break: keep-all;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <!-- 상단 텍스트 영역 -->
      <header
        class="pt-[15%] px-8 z-10 transition-opacity duration-300"
        id="header-content"
      >
        <h1
          class="text-[2.5rem] leading-[1.2] font-black text-brand-dark tracking-tight mb-1"
        >
          차박<br />
          어디로
          <span class="text-brand-sub font-bold text-[2.2rem]"
            >떠나야할지 모르겠나요</span
          >
        </h1>
        <p
          class="mt-5 text-brand-text text-[15px] leading-relaxed keep-all font-medium"
        >
          지도기반 위치 앱 및 키워드 검색으로내가 원하는 장소를 한번에
        </p>
      </header>

      <!-- 일러스트 영역 (순수 SVG 구현) -->
      <main
        class="flex-1 relative flex items-center justify-center w-full mt-4 transition-opacity duration-300"
        id="main-content"
      >
        <!-- 배경 삼각형 패턴 -->
        <div
          class="absolute right-0 top-1/2 -translate-y-[45%] w-[85%] h-[280px] bg-brand-bg -z-10"
          style="clip-path: polygon(100% 0, 100% 100%, 0 85%)"
        ></div>

        <!-- 곰돌이 SVG 일러스트 -->
        <div class="w-full max-w-[320px] px-4 relative z-0 scale-105">
          <svg
            viewBox="0 0 400 350"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="w-full h-auto drop-shadow-md"
          >
            <!-- 그림자 -->
            <ellipse cx="200" cy="310" rx="140" ry="15" fill="#E5E8F0" />

            <!-- 책 -->
            <path
              d="M70 300 Q110 280 150 300 L140 315 Q100 295 60 315 Z"
              fill="#F8F9FA"
              stroke="#344669"
              stroke-width="2"
            />
            <path
              d="M150 300 Q190 280 230 300 L240 315 Q200 295 160 315 Z"
              fill="#F8F9FA"
              stroke="#344669"
              stroke-width="2"
            />
            <!-- 펜 -->
            <rect
              x="100"
              y="302"
              width="40"
              height="6"
              rx="3"
              fill="#D32F2F"
              transform="rotate(15 100 302)"
            />
            <rect
              x="100"
              y="302"
              width="8"
              height="6"
              rx="2"
              fill="#1976D2"
              transform="rotate(15 100 302)"
            />

            <!-- 커피 컵 -->
            <path
              d="M290 240 L315 240 L310 310 L295 310 Z"
              fill="#D1D5DB"
              stroke="#344669"
              stroke-width="2"
            />
            <rect
              x="287"
              y="235"
              width="31"
              height="8"
              rx="2"
              fill="#E5E7EB"
              stroke="#344669"
              stroke-width="2"
            />
            <!-- 컵 로고 (발바닥) -->
            <circle cx="302" cy="275" r="4" fill="#546EA8" />
            <circle cx="295" cy="268" r="2.5" fill="#546EA8" />
            <circle cx="302" cy="265" r="2.5" fill="#546EA8" />
            <circle cx="309" cy="268" r="2.5" fill="#546EA8" />

            <!-- 곰 캐릭터 -->
            <!-- 왼쪽 다리 -->
            <path
              d="M140 250 Q120 310 160 305 Q180 300 170 260 Z"
              fill="#4B89DC"
              stroke="#344669"
              stroke-width="2.5"
              stroke-linejoin="round"
            />
            <ellipse
              cx="150"
              cy="290"
              rx="15"
              ry="10"
              fill="#FFFFFF"
              transform="rotate(-15 150 290)"
            />

            <!-- 몸통 -->
            <path
              d="M150 160 C130 220 130 280 200 280 C270 280 260 220 250 160 Z"
              fill="#4B89DC"
              stroke="#344669"
              stroke-width="2.5"
            />
            <!-- 배 (흰색) -->
            <path
              d="M170 190 C160 230 170 270 200 270 C230 270 235 230 230 190 Z"
              fill="#F0F4F8"
            />

            <!-- 오른쪽 다리 -->
            <path
              d="M240 250 Q280 310 240 305 Q220 300 230 260 Z"
              fill="#4B89DC"
              stroke="#344669"
              stroke-width="2.5"
              stroke-linejoin="round"
            />

            <!-- 왼쪽 팔 & 스마트폰 -->
            <path
              d="M155 180 Q140 220 165 230"
              fill="none"
              stroke="#4B89DC"
              stroke-width="22"
              stroke-linecap="round"
            />
            <path
              d="M155 180 Q140 220 165 230"
              fill="none"
              stroke="#344669"
              stroke-width="27"
              stroke-linecap="round"
              class="mix-blend-overlay opacity-20"
            />
            <rect
              x="145"
              y="195"
              width="22"
              height="40"
              rx="4"
              fill="#475569"
              stroke="#1E293B"
              stroke-width="2"
              transform="rotate(-20 145 195)"
            />

            <!-- 머리 -->
            <circle
              cx="200"
              cy="140"
              r="50"
              fill="#4B89DC"
              stroke="#344669"
              stroke-width="2.5"
            />
            <!-- 귀 -->
            <circle
              cx="160"
              cy="100"
              r="15"
              fill="#2A5C9A"
              stroke="#344669"
              stroke-width="2"
            />
            <circle
              cx="240"
              cy="100"
              r="15"
              fill="#2A5C9A"
              stroke="#344669"
              stroke-width="2"
            />
            <circle cx="160" cy="100" r="7" fill="#4B89DC" />
            <circle cx="240" cy="100" r="7" fill="#4B89DC" />

            <!-- 주둥이 & 코 & 눈 -->
            <ellipse
              cx="200"
              cy="155"
              rx="22"
              ry="16"
              fill="#FFFFFF"
              stroke="#344669"
              stroke-width="2"
            />
            <ellipse cx="200" cy="148" rx="7" ry="5" fill="#111827" />
            <path
              d="M190 158 Q200 165 210 158"
              fill="none"
              stroke="#111827"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="182" cy="135" r="4" fill="#111827" />
            <circle cx="218" cy="135" r="4" fill="#111827" />

            <!-- 오른쪽 팔 & 노트북 조작 -->
            <path
              d="M245 180 Q270 220 250 240"
              fill="none"
              stroke="#4B89DC"
              stroke-width="22"
              stroke-linecap="round"
            />

            <!-- 밀짚모자 -->
            <path
              d="M130 110 Q200 60 270 110"
              fill="#E6C280"
              stroke="#344669"
              stroke-width="2.5"
            />
            <ellipse
              cx="200"
              cy="110"
              rx="80"
              ry="12"
              fill="#F4D03F"
              stroke="#344669"
              stroke-width="2.5"
            />
            <path
              d="M158 92 Q200 105 242 92"
              fill="none"
              stroke="#4CA1AF"
              stroke-width="6"
            />
            <!-- 띠 -->
            <!-- 모자 위 나뭇잎 -->
            <path
              d="M200 65 Q215 50 220 65 Q205 80 200 65 Z"
              fill="#4CAF50"
              stroke="#2E7D32"
              stroke-width="1.5"
            />

            <!-- 전구 (아이디어) -->
            <path
              d="M275 60 L280 80 L290 80 L295 60 Z"
              fill="#D1D5DB"
              stroke="#344669"
              stroke-width="2"
            />
            <circle
              cx="285"
              cy="50"
              r="18"
              fill="#FDE047"
              stroke="#344669"
              stroke-width="2"
            />
            <path
              d="M285 40 L285 55 M278 45 L285 55 M292 45 L285 55"
              fill="none"
              stroke="#D97706"
              stroke-width="2"
              stroke-linecap="round"
            />
            <!-- 빛나는 효과 -->
            <line
              x1="285"
              y1="15"
              x2="285"
              y2="25"
              stroke="#FDE047"
              stroke-width="3"
              stroke-linecap="round"
            />
            <line
              x1="255"
              y1="35"
              x2="265"
              y2="42"
              stroke="#FDE047"
              stroke-width="3"
              stroke-linecap="round"
            />
            <line
              x1="315"
              y1="35"
              x2="305"
              y2="42"
              stroke="#FDE047"
              stroke-width="3"
              stroke-linecap="round"
            />

            <!-- 노트북 -->
            <rect
              x="220"
              y="240"
              width="60"
              height="45"
              rx="4"
              fill="#9CA3AF"
              stroke="#344669"
              stroke-width="2.5"
              transform="skewY(-10)"
            />
            <!-- 노트북 화면 안쪽 -->
            <rect
              x="225"
              y="235"
              width="50"
              height="35"
              rx="2"
              fill="#E5E7EB"
              transform="skewY(-10)"
            />
            <!-- 노트북 로고 (발바닥) -->
            <circle
              cx="250"
              cy="242"
              r="3.5"
              fill="#546EA8"
              transform="skewY(-10)"
            />
            <circle
              cx="244"
              cy="237"
              r="2"
              fill="#546EA8"
              transform="skewY(-10)"
            />
            <circle
              cx="250"
              cy="234"
              r="2"
              fill="#546EA8"
              transform="skewY(-10)"
            />
            <circle
              cx="256"
              cy="237"
              r="2"
              fill="#546EA8"
              transform="skewY(-10)"
            />

            <!-- 노트북 키보드 하판 -->
            <polygon
              points="215,295 285,283 260,305 190,305"
              fill="#D1D5DB"
              stroke="#344669"
              stroke-width="2"
            />
          </svg>
        </div>
      </main>

      <!-- 하단 인디케이터 및 버튼 영역 -->
      <footer
        class="w-full pb-8 pt-6 px-6 bg-white z-10 flex flex-col items-center"
      >
        <!-- 페이지네이션 도트 -->
        <div class="flex space-x-[10px] mb-[30px]" id="pagination-dots">
          <div
            class="w-2.5 h-2.5 rounded-full bg-brand-primary transition-colors duration-300"
            data-index="0"
          ></div>
          <div
            class="w-2.5 h-2.5 rounded-full bg-brand-dot transition-colors duration-300"
            data-index="1"
          ></div>
          <div
            class="w-2.5 h-2.5 rounded-full bg-brand-dot transition-colors duration-300"
            data-index="2"
          ></div>
        </div>

        <!-- 하단 고정 버튼 -->
        <button
          id="start-btn"
          class="w-full bg-brand-primary text-white py-4 rounded-[14px] text-[1.1rem] font-bold tracking-wide active:scale-[0.98] transition-all duration-200 shadow-sm flex justify-center items-center"
        >
          <span>시작하기</span>
        </button>
      </footer>
    </div>

    <!-- 기능 제어 스크립트 -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("start-btn");
        const dots = document.querySelectorAll("#pagination-dots div");
        const headerContent = document.getElementById("header-content");
        const mainContent = document.getElementById("main-content");

        let currentPage = 0;
        const maxPages = 3;

        // 더미 데이터 (페이지 전환 시뮬레이션용)
        const pageData = [
          {
            title:
              '차박<br>어디로 <span class="text-brand-sub font-bold text-[2.2rem]">떠나야할지 모르겠나요</span>',
            desc: "지도기반 위치 앱 및 키워드 검색으로내가 원하는 장소를 한번에",
            btnText: "시작하기",
          },
          {
            title:
              '맞춤형<br>차박 명소 <span class="text-brand-sub font-bold text-[2.2rem]">추천받기</span>',
            desc: "실시간 날씨와 편의시설 데이터를 반영한 최적의 차박지 추천 시스템",
            btnText: "다음",
          },
          {
            title:
              '지금 바로<br>자연 속으로 <span class="text-brand-sub font-bold text-[2.2rem]">떠나보세요</span>',
            desc: "모든 준비는 끝났습니다. 안전하고 즐거운 차박 캠핑을 시작하세요.",
            btnText: "앱 시작하기",
          },
        ];

        // 버튼 클릭 이벤트 처리
        startBtn.addEventListener("click", () => {
          // UI 전환 애니메이션 적용을 위한 클래스 토글
          headerContent.classList.add("opacity-0");
          mainContent.classList.add("opacity-50", "scale-95");

          // 0.2초 후 데이터 변경 및 페이드 인
          setTimeout(() => {
            currentPage = (currentPage + 1) % maxPages; // 순환 구조

            // 텍스트 업데이트
            headerContent.querySelector("h1").innerHTML =
              pageData[currentPage].title;
            headerContent.querySelector("p").innerHTML =
              pageData[currentPage].desc;
            startBtn.querySelector("span").innerText =
              pageData[currentPage].btnText;

            // 도트 업데이트
            dots.forEach((dot, index) => {
              if (index === currentPage) {
                dot.classList.remove("bg-brand-dot");
                dot.classList.add("bg-brand-primary");
              } else {
                dot.classList.remove("bg-brand-primary");
                dot.classList.add("bg-brand-dot");
              }
            });

            // 페이드 인
            headerContent.classList.remove("opacity-0");
            mainContent.classList.remove("opacity-50", "scale-95");
          }, 200);
        });
      });
    </script>
  </body>
</html>
